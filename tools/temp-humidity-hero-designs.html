<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>온습도 카드 hero 디자인 안</title>
  <style>
    :root {
      --surface-canvas: #f0ede7;
      --surface-card: #fff;
      --surface-soft: #f7f5f0;
      --text-primary: #1a1a18;
      --text-secondary: #6b675f;
      --text-tertiary: #9a958a;
      --border-subtle: rgba(26, 26, 24, .08);
      --accent: #315f6f;
      --accent-tint: #e7f0f1;
      --shadow-card: 0 16px 48px rgba(26, 26, 24, .10);
      --radius-card: 24px;
      --font: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface-canvas); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    .page { max-inline-size: 1280px; margin: 0 auto; padding: 40px 20px 80px; display: grid; gap: 28px; }
    .overline { font-size: 11px; letter-spacing: .14em; font-weight: 600; color: var(--text-tertiary); }
    h1 { font-size: 26px; margin: 4px 0 0; line-height: 1.35; }
    .intro { margin: 0; max-inline-size: 76ch; color: var(--text-secondary); font-size: 14px; line-height: 1.65; }
    h2 { font-size: 15px; color: var(--text-secondary); font-weight: 600; margin: 8px 0 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    figure { margin: 0; display: grid; gap: 8px; }
    figcaption { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    figcaption b { color: var(--text-primary); }

    /* 공통 compact 문법: 164px = hero 154 + tail 10, radius 24 */
    .card {
      position: relative; inline-size: 100%; block-size: 164px; padding: 0; border: 0; border-radius: var(--radius-card);
      overflow: hidden; background: var(--surface-card); text-align: start; font: inherit; color: var(--text-primary);
      box-shadow: var(--shadow-card); cursor: pointer;
    }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .photo { position: absolute; inset: 0 0 10px; background-size: cover; background-position: center; }
    .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,17,14,.16) 0%, rgba(20,17,14,.34) 48%, rgba(20,17,14,.72) 100%); }
    .scrim-soft { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,17,14,.05) 0%, rgba(20,17,14,.20) 45%, rgba(20,17,14,.55) 100%); }
    .tail { position: absolute; inset: auto 0 0; block-size: 10px; background: var(--surface-card); }
    .badge { position: absolute; top: 14px; inset-inline-end: 16px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--text-primary); font-size: 11px; font-weight: 700; }
    .eyebrow { font-size: 10px; letter-spacing: .14em; font-weight: 700; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 11px; font-weight: 600; }
    .value { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
    .unit { font-size: 14px; font-weight: 600; margin-inline-start: 2px; }

    /* 1. stack: 사진 위 오버레이, 하단 두 값 */
    .d-stack .content { position: absolute; inset: 0 0 10px; display: grid; align-content: space-between; padding: 16px 18px; color: #fff; }
    .d-stack .eyebrow { color: rgba(255,255,255,.88); }
    .d-stack .readout { display: flex; align-items: flex-end; gap: 22px; }
    .d-stack .label { color: rgba(255,255,255,.86); }

    /* 2. inline: 한 줄 요약 */
    .d-inline .content { position: absolute; inset: 0 0 10px; display: grid; align-content: space-between; padding: 16px 18px; color: #fff; }
    .d-inline .eyebrow { color: rgba(255,255,255,.88); }
    .d-inline .row { display: flex; align-items: baseline; gap: 10px; }
    .d-inline .row .label { color: rgba(255,255,255,.86); }

    /* 3. split: 좌 사진 / 우 크림 패널 */
    .d-split { background: var(--surface-card); }
    .d-split .photo { inset: 0 auto 10px 0; inline-size: 42%; }
    .d-split .scrim { inset: 0 auto 10px 0; inline-size: 42%; background: linear-gradient(90deg, rgba(20,17,14,.10) 0%, rgba(20,17,14,.34) 100%); }
    .d-split .content { position: absolute; inset: 0 0 10px 42%; display: grid; align-content: space-between; padding: 16px 18px; }
    .d-split .eyebrow { color: var(--text-tertiary); }
    .d-split .readout { display: flex; gap: 20px; }
    .d-split .label { color: var(--text-secondary); }
    .d-split .badge { background: var(--accent-tint); color: #2f5a68; }

    /* 4. glass: 하단 프로스트 크림 바 위 숫자 */
    .d-glass .content { position: absolute; inset: 0 0 10px; display: grid; align-content: space-between; padding: 16px 18px; color: #fff; }
    .d-glass .eyebrow { color: rgba(255,255,255,.9); }
    .d-glass .bar { display: flex; align-items: flex-end; gap: 22px; padding: 10px 14px; border-radius: 16px; background: rgba(251,248,242,.88); color: var(--text-primary); backdrop-filter: blur(6px); }
    .d-glass .bar .label { color: var(--text-secondary); }

    /* 5. focus: 온도 하나만 크게, 습도는 칩 */
    .d-focus .content { position: absolute; inset: 0 0 10px; display: grid; align-content: space-between; padding: 16px 18px; color: #fff; }
    .d-focus .eyebrow { color: rgba(255,255,255,.88); }
    .d-focus .row { display: flex; align-items: flex-end; gap: 12px; }
    .d-focus .huge { font-size: 34px; font-weight: 700; line-height: .95; letter-spacing: -.02em; }
    .d-focus .chip { padding: 5px 10px; border-radius: 999px; background: rgba(251,248,242,.9); color: var(--text-primary); font-size: 12px; font-weight: 700; }

    /* 6. panel: 사진 위 우측 흰 숫자 패널 */
    .d-panel .content { position: absolute; inset: 0 0 10px; padding: 16px 18px; color: #fff; display: grid; align-content: space-between; }
    .d-panel .eyebrow { color: rgba(255,255,255,.88); }
    .d-panel .panel { position: absolute; top: 46px; inset-inline-end: 16px; display: grid; gap: 8px; padding: 10px 12px; border-radius: 16px; background: rgba(251,248,242,.92); color: var(--text-primary); }
    .d-panel .panel-row { display: flex; align-items: baseline; gap: 8px; }
    .d-panel .panel .label { color: var(--text-secondary); }
    .d-panel .panel .value { font-size: 22px; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="overline">HA-DESIGN · TEMPERATURE &amp; HUMIDITY · HERO DESIGNS</div>
      <h1>합격한 두 사진으로 카드 디자인을 6가지 뽑았습니다</h1>
      <p class="intro">값·문구·배지·164px 문법은 고정하고 레이아웃과 사진 위 대비 처리만 바꿨습니다. 같은 사진이 위아래 두 카드에 쓰였으니 디자인끼리 비교해 고르면 됩니다. 실제 값은 안방 기준(22.8°C / 65%)입니다.</p>
    </header>

    <section>
      <h2>사진 1 · 흰 디지털 온습도계 (22.5 표시)</h2>
      <div class="grid" data-role="grid-a"></div>
    </section>

    <section>
      <h2>사진 2 · 벽걸이 온도 조절기 (따뜻한 목재·블라인드 그림자)</h2>
      <div class="grid" data-role="grid-b"></div>
    </section>
  </main>

  <script type="module">
    const photo = (id, w = 1200) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=85`;
    const HEROS = {
      digital: { id: "photo-1610389337008-84e005329867", name: "흰 디지털 온습도계" },
      wall: { id: "photo-1786779572437-4f6ea0b75298", name: "벽걸이 온도 조절기" },
    };
    const ROOM = { eyebrow: "TEMPERATURE & HUMIDITY · BEDROOM", title: "안방 온습도", temperature: 22.8, humidity: 65, badge: "쾌적해요" };
    const value = (n, unit) => `${n}<span class="unit">${unit}</span>`;

    const designs = [
      {
        key: "stack", name: "1. 사진 위 오버레이, 하단 두 값",
        note: "지금 배포본과 같은 구조. 익숙하지만 사진 밝은 곳에서 대비가 약해질 수 있다.",
        html: (photoUrl) => `
          <div class="card d-stack"><span class="photo" style="background-image:url('${photoUrl}')"></span><span class="scrim"></span><span class="badge">${ROOM.badge}</span>
            <span class="content"><span><span class="eyebrow">${ROOM.eyebrow}</span><br><span class="title">${ROOM.title}</span></span>
            <span class="readout"><span><span class="label">온도</span><br><span class="value">${value(ROOM.temperature.toFixed(1), "°C")}</span></span>
            <span><span class="label">습도</span><br><span class="value">${value(ROOM.humidity.toFixed(0), "%")}</span></span></span></span>
            <span class="tail"></span></div>`,
      },
      {
        key: "inline", name: "2. 한 줄 요약형",
        note: "값을 한 줄에 붙여 카드가 가장 조용하다. 작은 글씨가 늘어나 좁은 폭에서 불리하다.",
        html: (photoUrl) => `
          <div class="card d-inline"><span class="photo" style="background-image:url('${photoUrl}')"></span><span class="scrim"></span><span class="badge">${ROOM.badge}</span>
            <span class="content"><span><span class="eyebrow">${ROOM.eyebrow}</span><br><span class="title">${ROOM.title}</span></span>
            <span class="row"><span class="label">온도</span><span class="value">${value(ROOM.temperature.toFixed(1), "°C")}</span><span class="label">습도</span><span class="value">${value(ROOM.humidity.toFixed(0), "%")}</span></span></span>
            <span class="tail"></span></div>`,
      },
      {
        key: "split", name: "3. 좌 사진 / 우 크림 패널",
        note: "사진과 텍스트가 섞이지 않아 대비가 가장 안정적이다. 사진이 작게 보인다.",
        html: (photoUrl) => `
          <div class="card d-split"><span class="photo" style="background-image:url('${photoUrl}')"></span><span class="scrim"></span><span class="badge">${ROOM.badge}</span>
            <span class="content"><span><span class="eyebrow">${ROOM.eyebrow}</span><br><span class="title">${ROOM.title}</span></span>
            <span class="readout"><span><span class="label">온도</span><br><span class="value">${value(ROOM.temperature.toFixed(1), "°C")}</span></span>
            <span><span class="label">습도</span><br><span class="value">${value(ROOM.humidity.toFixed(0), "%")}</span></span></span></span>
            <span class="tail"></span></div>`,
      },
      {
        key: "glass", name: "4. 하단 프로스트 크림 바",
        note: "숫자는 항상 크림 바 위에서 읽혀 밝은 사진에도 강하다. 바가 카드 하단을 차지한다.",
        html: (photoUrl) => `
          <div class="card d-glass"><span class="photo" style="background-image:url('${photoUrl}')"></span><span class="scrim-soft"></span><span class="badge">${ROOM.badge}</span>
            <span class="content"><span><span class="eyebrow">${ROOM.eyebrow}</span><br><span class="title">${ROOM.title}</span></span>
            <span class="bar"><span><span class="label">온도</span><br><span class="value">${value(ROOM.temperature.toFixed(1), "°C")}</span></span>
            <span><span class="label">습도</span><br><span class="value">${value(ROOM.humidity.toFixed(0), "%")}</span></span></span></span>
            <span class="tail"></span></div>`,
      },
      {
        key: "focus", name: "5. 온도 강조 + 습도 칩",
        note: "한눈에 온도가 먼저 들어온다. 습도는 보조로 내려간다.",
        html: (photoUrl) => `
          <div class="card d-focus"><span class="photo" style="background-image:url('${photoUrl}')"></span><span class="scrim"></span><span class="badge">${ROOM.badge}</span>
            <span class="content"><span><span class="eyebrow">${ROOM.eyebrow}</span><br><span class="title">${ROOM.title}</span></span>
            <span class="row"><span class="huge">${value(ROOM.temperature.toFixed(1), "°C")}</span><span class="chip">습도 ${ROOM.humidity.toFixed(0)}%</span></span></span>
            <span class="tail"></span></div>`,
      },
      {
        key: "panel", name: "6. 사진 위 우측 흰 숫자 패널",
        note: "숫자만 흰 패널로 떼어 대비를 확보한다. 패널이 배지를 밀어내 배치는 조정이 필요하다.",
        html: (photoUrl) => `
          <div class="card d-panel"><span class="photo" style="background-image:url('${photoUrl}')"></span><span class="scrim"></span>
            <span class="content"><span><span class="eyebrow">${ROOM.eyebrow}</span><br><span class="title">${ROOM.title}</span></span></span>
            <span class="panel"><span class="panel-row"><span class="label">온도</span><span class="value">${value(ROOM.temperature.toFixed(1), "°C")}</span></span>
            <span class="panel-row"><span class="label">습도</span><span class="value">${value(ROOM.humidity.toFixed(0), "%")}</span></span></span>
            <span class="badge" style="top:auto;bottom:22px;inset-inline-end:auto;inset-inline-start:16px">${ROOM.badge}</span>
            <span class="tail"></span></div>`,
      },
    ];

    const renderGrid = (selector, heroKey) => {
      document.querySelector(selector).innerHTML = designs.map((design) => `
        <figure>
          <button type="button" class="card-holder" tabindex="-1" aria-hidden="true" style="all:unset">${design.html(photo(HEROS[heroKey].id))}</button>
          <figcaption><b>${design.name}</b><br>${design.note}</figcaption>
        </figure>`).join("");
    };

    renderGrid('[data-role="grid-a"]', "digital");
    renderGrid('[data-role="grid-b"]', "wall");
    document.body.dataset.ready = "true";
  </script>
</body>
</html>
