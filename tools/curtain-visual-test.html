<!doctype html>
<!-- allow: SIZE_OK — This file is the complete two-curtain browser E2E scenario. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curtain tile and detail</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 12px 40px;
      background: #F0EDE7;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      display: grid;
      gap: 28px;
      inline-size: min(100%, 492px);
      margin-inline: auto;
    }
    header {
      display: grid;
      gap: 8px;
    }
    header small {
      color: #7254A3;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 10vw, 52px);
      line-height: 1.02;
      letter-spacing: -.05em;
      word-break: keep-all;
    }
    header p {
      margin: 0;
      color: #716D64;
      font-size: 15px;
      line-height: 1.5;
      word-break: keep-all;
    }
    .curtain-grid {
      display: grid;
      grid-template-columns: repeat(2, 164px);
      justify-content: center;
      gap: 12px;
    }
    .result {
      justify-self: start;
      margin: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: #FFFFFF;
      color: #716D64;
      font-size: 12px;
      font-weight: 800;
    }
  </style>
</head>
<body data-result="pending">
  <main>
    <header>
      <small>CURTAIN · SHARED TILE</small>
      <h1>빛을 여는 두 장</h1>
      <p>거실과 안방을 나란히 보고, 카드 전체를 눌러 위치를 조절합니다.</p>
    </header>
    <section class="curtain-grid" aria-label="커튼 카드">
      <ha-design-curtain-card id="living-curtain"></ha-design-curtain-card>
      <ha-design-curtain-card id="bedroom-curtain"></ha-design-curtain-card>
    </section>
    <p class="result" id="result">CHECKING</p>
  </main>

  <script type="module">
    import "../www/ha-design/ha-design-curtain-card.js?visual=adaptive-compact-1";

    const serviceCalls = [];
    const confirmations = [];
    window.__curtainServiceCalls = serviceCalls;
    window.confirm = (message) => {
      confirmations.push(message);
      return true;
    };
    const states = {
      "cover.geosilkeoteun": {
        state: "open",
        attributes: {
          current_position: 64,
          device_class: "curtain",
          friendly_name: "거실커튼",
          supported_features: 15,
        },
      },
      "cover.anbangkeoteun": {
        state: "closed",
        attributes: {
          current_position: 0,
          device_class: "curtain",
          friendly_name: "안방커튼",
          supported_features: 15,
        },
      },
    };
    for (const prefix of ["geosilkeoteun", "anbangkeoteun"]) {
      states[`binary_sensor.${prefix}_motor_fault`] = { state: "unknown", attributes: {} };
      states[`select.${prefix}_reverse_direction`] = {
        state: prefix === "geosilkeoteun" ? "forward" : "unknown",
        attributes: { options: ["forward", "back"] },
      };
      states[`select.${prefix}_motor_working_mode`] = {
        state: "continuous",
        attributes: { options: ["continuous", "intermittently"] },
      };
      for (const limit of ["upper", "middle", "lower"]) {
        states[`select.${prefix}_${limit}_stroke_limit`] = {
          state: "SET",
          attributes: { options: ["SET", "RESET"] },
        };
      }
    }
    const hass = {
      states,
      callService: async (domain, service, data) => {
        serviceCalls.push({ domain, service, data });
      },
    };

    await customElements.whenDefined("ha-design-curtain-card");
    const living = document.querySelector("#living-curtain");
    const bedroom = document.querySelector("#bedroom-curtain");
    const whenCardReady = (host) =>
      new Promise((resolve, reject) => {
        const timeout = window.setTimeout(
          () => reject(new Error(`${host.id} did not become ready`)),
          5000,
        );
        host.addEventListener(
          "ha-design-card-ready",
          () => {
            window.clearTimeout(timeout);
            resolve();
          },
          { once: true },
        );
      });
    const livingReady = whenCardReady(living);
    const bedroomReady = whenCardReady(bedroom);
    living.setConfig({
      entity: "cover.geosilkeoteun",
      title: "거실 커튼",
      eyebrow: "CURTAIN · LIVING ROOM",
      travel_duration: 0.1,
      motor_fault_entity: "binary_sensor.geosilkeoteun_motor_fault",
      reverse_direction_entity: "select.geosilkeoteun_reverse_direction",
      motor_working_mode_entity: "select.geosilkeoteun_motor_working_mode",
      upper_stroke_limit_entity: "select.geosilkeoteun_upper_stroke_limit",
      middle_stroke_limit_entity: "select.geosilkeoteun_middle_stroke_limit",
      lower_stroke_limit_entity: "select.geosilkeoteun_lower_stroke_limit",
    });
    bedroom.setConfig({
      entity: "cover.anbangkeoteun",
      title: "안방 커튼",
      eyebrow: "CURTAIN · BEDROOM",
      travel_duration: 0.1,
      motor_fault_entity: "binary_sensor.anbangkeoteun_motor_fault",
      reverse_direction_entity: "select.anbangkeoteun_reverse_direction",
      motor_working_mode_entity: "select.anbangkeoteun_motor_working_mode",
      upper_stroke_limit_entity: "select.anbangkeoteun_upper_stroke_limit",
      middle_stroke_limit_entity: "select.anbangkeoteun_middle_stroke_limit",
      lower_stroke_limit_entity: "select.anbangkeoteun_lower_stroke_limit",
    });
    living.hass = hass;
    bedroom.hass = hass;
    await Promise.all([livingReady, bedroomReady]);

    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const closeAndWait = async (host) => {
      const root = host.shadowRoot;
      const dialog = root.querySelector("dialog");
      const closed = new Promise((resolve) => dialog.addEventListener("close", resolve, { once: true }));
      root.querySelector('[data-action="dismiss"]').click();
      await closed;
      assert(root.activeElement === root.querySelector(".curtain-launcher"), "focus was not restored");
      assert(root.querySelector(".curtain-launcher").getAttribute("aria-expanded") === "false", "aria-expanded stayed true");
    };

    try {
      const livingRect = living.getBoundingClientRect();
      const bedroomRect = bedroom.getBoundingClientRect();
      assert(Math.abs(livingRect.width - bedroomRect.width) < 1, "tile widths differ");
      assert(Math.abs(livingRect.height - bedroomRect.height) < 1, "tile heights differ");
      assert(Math.abs(livingRect.width - 164) < 1, `curtain card width is ${livingRect.width}, expected 164`);
      assert(Math.abs(livingRect.height - 164) < 1, `curtain card height is ${livingRect.height}, expected 164`);
      assert(living.shadowRoot.querySelector(".curtain-launcher").dataset.deviceCompactLayout === "adaptive", "living is not adaptive");
      assert(bedroom.shadowRoot.querySelector(".curtain-launcher").dataset.deviceCompactLayout === "adaptive", "bedroom is not adaptive");

      const launcher = living.shadowRoot.querySelector(".curtain-launcher");
      const launcherRect = launcher.getBoundingClientRect();
      const visualRect = launcher.querySelector(".device-compact-visual").getBoundingClientRect();
      assert(Math.abs(launcherRect.width - launcherRect.height) < 1, "curtain compact card is not square");
      assert(Math.abs(visualRect.height - 154) < 1, `curtain hero height is ${visualRect.height}, expected 154`);
      launcher.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      let dialog = living.shadowRoot.querySelector("dialog");
      assert(dialog.open, "Enter did not open detail");
      assert(living.shadowRoot.activeElement === living.shadowRoot.querySelector('[data-action="dismiss"]'), "close control lacks focus");

      const focusedRange = living.shadowRoot.querySelector('[data-action="position"]');
      focusedRange.focus();
      states["cover.geosilkeoteun"].attributes.current_position = 65;
      living.hass = hass;
      dialog = living.shadowRoot.querySelector("dialog");
      assert(dialog.open, "HA update closed the detail dialog");
      assert(Number(living.shadowRoot.querySelector('[data-action="position"]').value) === 65, "focused range masked HA position");
      assert(living.shadowRoot.activeElement === living.shadowRoot.querySelector('[data-action="position"]'), "HA update lost range focus");
      const labelledBy = dialog.getAttribute("aria-labelledby");
      assert(dialog.querySelector(`#${labelledBy}`)?.textContent === "거실 커튼", "HA update lost dialog name");
      states["cover.geosilkeoteun"].attributes.current_position = 64;
      living.hass = hass;

      living.shadowRoot.querySelector('[data-action="open"]').click();
      living.shadowRoot.querySelector('[data-action="stop"]').click();
      living.shadowRoot.querySelector('[data-action="close"]').click();
      const range = living.shadowRoot.querySelector('[data-action="position"]');
      range.value = "36";
      range.dispatchEvent(new Event("input", { bubbles: true }));
      assert(living.shadowRoot.querySelector('[data-output="position"]').textContent === "36%", "position preview failed");
      range.dispatchEvent(new Event("change", { bubbles: true }));
      const serviceSequence = serviceCalls.map(({ service }) => service).join(",");
      assert(
        serviceSequence === "open_cover,stop_cover,close_cover,set_cover_position",
        `service contract failed: ${serviceSequence}`,
      );
      assert(serviceCalls.at(-1).data.position === 36, "position service value failed");
      assert(serviceCalls.every(({ service }) => !service.includes("tilt")), "unsupported tilt service exposed");

      const faultStatus = living.shadowRoot.querySelector(".curtain-fault-status");
      assert(faultStatus.classList.contains("is-unknown"), "unknown motor fault was not neutral");
      assert(faultStatus.textContent.includes("확인 중"), "unknown motor fault copy was misleading");
      const reverse = living.shadowRoot.querySelector('[data-entity="select.geosilkeoteun_reverse_direction"]');
      reverse.value = "back";
      reverse.dispatchEvent(new Event("change", { bubbles: true }));
      const motorMode = living.shadowRoot.querySelector('[data-entity="select.geosilkeoteun_motor_working_mode"]');
      motorMode.value = "intermittently";
      motorMode.dispatchEvent(new Event("change", { bubbles: true }));
      for (const [limit, option] of [["upper", "SET"], ["middle", "RESET"], ["lower", "SET"]]) {
        living.shadowRoot.querySelector(`[data-entity="select.geosilkeoteun_${limit}_stroke_limit"][data-option="${option}"]`).click();
      }
      const advancedCalls = serviceCalls.slice(-5);
      assert(advancedCalls.every(({ domain, service }) => domain === "select" && service === "select_option"), "advanced controls used the wrong service");
      assert(advancedCalls.map(({ data }) => `${data.entity_id}:${data.option}`).join(",") === [
        "select.geosilkeoteun_reverse_direction:back",
        "select.geosilkeoteun_motor_working_mode:intermittently",
        "select.geosilkeoteun_upper_stroke_limit:SET",
        "select.geosilkeoteun_middle_stroke_limit:RESET",
        "select.geosilkeoteun_lower_stroke_limit:SET",
      ].join(","), "advanced entity or option contract failed");
      assert(confirmations.length === 5, "direction, motor mode, and stroke commands were not all confirmed");
      const disabledBedroomDirection = bedroom.shadowRoot.querySelector('[data-entity="select.anbangkeoteun_reverse_direction"]');
      assert(disabledBedroomDirection.disabled, "unknown advanced control stayed enabled");

      states["cover.anbangkeoteun"].state = "unknown";
      const callsBeforeUnknown = serviceCalls.length;
      bedroom.hass = hass;
      const unknownRoot = bedroom.shadowRoot;
      assert(unknownRoot.querySelector(".device-compact-status").textContent.includes("상태 확인 중"), "unknown cover showed directional status");
      assert(unknownRoot.querySelector(".device-compact-badge").textContent === "확인 필요", "unknown cover showed a directional badge");
      unknownRoot.querySelector(".curtain-launcher").click();
      const unknownDialog = unknownRoot.querySelector("dialog");
      assert(unknownDialog.querySelector('[data-output="position"]').textContent === "확인 중", "unknown cover showed numeric position");
      assert(unknownDialog.querySelector('[data-action="open"]').disabled, "unknown cover open control stayed enabled");
      assert(unknownDialog.querySelector('[data-action="stop"]').disabled, "unknown cover stop control stayed enabled");
      assert(unknownDialog.querySelector('[data-action="close"]').disabled, "unknown cover close control stayed enabled");
      assert(serviceCalls.length === callsBeforeUnknown, "unknown cover rendering called a service");
      unknownDialog.close();

      range.value = "64";
      range.dispatchEvent(new Event("input", { bubbles: true }));
      await closeAndWait(living);

      bedroom.shadowRoot.querySelector(".curtain-launcher").dispatchEvent(
        new KeyboardEvent("keydown", { code: "Space", bubbles: true }),
      );
      assert(bedroom.shadowRoot.querySelector("dialog").open, "Space code did not open detail");
      await closeAndWait(bedroom);

      document.body.dataset.result = "pass";
      document.querySelector("#result").textContent = "PASS";
      if (new URLSearchParams(location.search).get("modal") === "living") {
        living.shadowRoot.querySelector(".curtain-launcher").click();
      }
    } catch (error) {
      document.body.dataset.result = "fail";
      document.querySelector("#result").textContent = `FAIL · ${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
