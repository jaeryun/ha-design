function eventMarkup(items){const selected=new Set(state.selectedEvents);return items.map(item=>{const active=item.events.some(event=>selected.has(event.index));if(item.type==="cluster")return`<span class="visual-cluster ${item.events.length>=10?"large":""} ${active?"selected-event":""}" style="inset-inline-start:${item.center/24*100}%" data-event-count="${item.events.length}"><span class="event-count">${item.events.length}</span></span>`;if(item.type==="activity"){const dominant=item.kinds.length===1?`var(--accent-${item.kinds[0]==="motion"?"lighting":item.kinds[0]==="sound"?"curtain":"camera"})`:"var(--accent-camera)";return`<span class="activity-window ${active?"selected-event":""}" style="--event-color:${dominant};inset-inline-start:${item.center/24*100}%;inline-size:max(6px,${(item.end-item.start)/24*100}%)"></span>`}const kind=item.kinds[0],color=kind==="motion"?"var(--accent-lighting)":kind==="sound"?"var(--accent-curtain)":"var(--accent-camera)";return`<span class="event-point ${active?"selected-event":""}" style="--event-color:${color};inset-inline-start:${item.center/24*100}%"></span>`}).join("")}
function contextMarkup(day){const status=mediaState(day,state.time),interval=intervalAt(day,state.time);if(state.selectedEvents.length&&queryState[day.date]==="ready"){const selected=day.events.filter((_,index)=>state.selectedEvents.includes(index)),counts={person:0,motion:0,sound:0};selected.forEach(event=>{counts[event.kind]++});const start=Math.min(...selected.map(event=>event.time)),end=Math.max(...selected.map(event=>event.time)),range=start===end?formatTime(start):`${formatTime(start,false)}–${formatTime(end,false)}`,details=Object.entries(counts).filter(([,count])=>count).map(([kind,count])=>`${kindLabel[kind]} ${count}`).join(" · ");return`<div class="timeline-context"><span><strong>${range}</strong> · ${details}</span></div>`}if(status==="gap")return`<div class="timeline-context"><span><strong>${formatTime(interval.start,false)}–${formatTime(interval.end,false)}</strong> · 녹화 없음</span><span class="context-actions"><button class="context-button" type="button" data-action="previous-recording">이전 녹화</button><button class="context-button" type="button" data-action="next-recording">다음 녹화</button></span></div>`;if(status==="unknown")return`<div class="timeline-context"><span><strong>${formatTime(interval.start,false)}–${formatTime(interval.end,false)}</strong> · 녹화 상태 확인 불가</span></div>`;if(status==="error")return`<div class="timeline-context warning"><span><strong>기록 조회 실패</strong> · 녹화 기록을 불러오지 못했습니다.</span><button class="context-button" type="button" data-action="retry">다시 확인</button></div>`;if(status==="empty")return`<div class="timeline-context"><span><strong>녹화 없음</strong> · 확인된 전체 날짜</span></div>`;if(status==="future")return`<div class="timeline-context"><span><strong>현재 시각 14:30</strong> · 이후 시간은 선택할 수 없어요.</span></div>`;return""}
function playheadAtEvent(day){return queryState[day.date]==="ready"&&day.events.some(event=>Math.abs(event.time-state.time)<=5/60)}
function timelineMarkup(){const day=days[state.day],today=day.date===MOCK_NOW.date,now=today?`<span class="now-boundary" style="inset-inline-start:${MOCK_NOW.hour/24*100}%"><i class="now-label">지금</i></span>`:"";return`<section class="timeline-section"><header class="timeline-header"><span class="timeline-date"><strong>${formatDate(day.date)}${today?" · 오늘":""}</strong><small>${summaryLabel(day)}</small></span><output class="selected-time" aria-live="polite">${formatTime(state.time)}</output></header><div class="timeline-surface ${state.selectedEvents.length||playheadAtEvent(day)?"playhead-at-event":""}" tabindex="0" role="slider" aria-label="${formatDate(day.date)} 통합 카메라 타임라인" aria-valuemin="0" aria-valuemax="${Math.floor(maxSeekTime(day)*3600)}" aria-valuenow="${Math.floor(state.time*3600)}" aria-valuetext="${formatTime(state.time)}" aria-describedby="timeline-event-summary" data-timeline><div class="timeline-plot"><span class="timeline-guides guide-desktop">${guideMarkup(day,[0,4,8,12,16,20,24])}</span><span class="timeline-guides guide-mobile">${guideMarkup(day,[0,6,12,18,24])}</span><div class="event-lane" data-event-lane></div><div class="coverage-lane">${coverageMarkup(day)}</div>${now}<span class="playhead" style="inset-inline-start:${state.time/24*100}%"></span></div>${axisMarkup("axis-desktop",[0,4,8,12,16,20,24])}${axisMarkup("axis-mobile",[0,6,12,18,24])}</div>${contextMarkup(day)}<span class="sr-only" id="timeline-event-summary" data-cluster-summary></span></section>`}
function drawTimelineEvents(){const lane=root.querySelector("[data-event-lane]");if(!lane)return;const day=days[state.day],items=queryState[day.date]==="ready"?visualEvents(day.events,lane.clientWidth):[];lane.innerHTML=eventMarkup(items);lane.dataset.itemCount=String(items.length);lane.dataset.eventCount=String(day.events.length);lane.__items=items;root.querySelector("[data-cluster-summary]").textContent=items.map(item=>{const counts={person:0,motion:0,sound:0};item.events.forEach(event=>{counts[event.kind]++});const details=Object.entries(counts).filter(([,count])=>count).map(([kind,count])=>`${kindLabel[kind]} ${count}`).join(" · ");return`${formatTime(item.center)} · ${item.events.length}개 이벤트 · ${details}`}).join(". ")}
function render(options={}){const restore=options.restoreTimeline===true;timelineObserver?.disconnect();root.innerHTML=`${headerMarkup()}<nav class="day-selector" aria-label="최근 7일">${daysMarkup()}</nav>${mediaMarkup()}${timelineMarkup()}`;drawTimelineEvents();const timeline=root.querySelector("[data-timeline]");timelineObserver=new ResizeObserver(drawTimelineEvents);timelineObserver.observe(timeline);if(restore)timeline.focus()}
function setTime(time,{restoreTimeline=false,selectedEvents=[]}={}){const day=days[state.day];state.time=Math.max(0,Math.min(maxSeekTime(day),time));state.selectedEvents=selectedEvents;render({restoreTimeline})}function seekRecording(direction){const day=days[state.day],current=intervalAt(day,state.time);if(current?.type!=="gap")return;const recorded=recordedIntervals(day);if(direction<0){const previous=[...recorded].reverse().find(interval=>interval.end<=current.start);if(previous)setTime(Math.max(previous.start,previous.end-1/3600),{restoreTimeline:true})}else{const next=recorded.find(interval=>interval.start>=current.end);if(next)setTime(next.start,{restoreTimeline:true})}}
function timelinePointer(event){const timeline=event.target.closest("[data-timeline]");if(!timeline)return;const plot=timeline.querySelector(".timeline-plot"),box=plot.getBoundingClientRect(),hours=Math.max(0,Math.min(maxSeekTime(days[state.day]),(event.clientX-box.left)/box.width*24));if(event.clientY<=box.top+30){const items=plot.querySelector("[data-event-lane]").__items||[];if(items.length){const nearest=items.reduce((best,item)=>Math.abs(item.center-hours)<Math.abs(best.center-hours)?item:best,items[0]);setTime(nearest.center,{selectedEvents:nearest.events.map(item=>item.index)});return}}setTime(hours)}
root.addEventListener("pointerdown",event=>{if(!event.target.closest("button"))timelinePointer(event)});root.addEventListener("click",event=>{const dayButton=event.target.closest("[data-day]");if(dayButton){state.day=Number(dayButton.dataset.day);state.time=defaultTime(days[state.day]);state.selectedEvents=[];render();root.querySelector(`[data-day="${state.day}"]`)?.focus();return}const action=event.target.closest("[data-action]")?.dataset.action;if(action==="retry"){queryState[days[state.day].date]="ready";setTime(defaultTime(days[state.day]),{restoreTimeline:true});return}if(action==="previous-recording"||action==="next-recording")seekRecording(action==="next-recording"?1:-1)});root.addEventListener("keydown",event=>{const timeline=event.target.closest("[data-timeline]");if(!timeline||!["ArrowLeft","ArrowRight","Home","End","Enter"," "].includes(event.key))return;event.preventDefault();if(event.key==="Enter"||event.key===" "){const items=timeline.querySelector("[data-event-lane]").__items||[];if(!items.length)return;const nearest=items.reduce((best,item)=>Math.abs(item.center-state.time)<Math.abs(best.center-state.time)?item:best,items[0]);setTime(nearest.center,{restoreTimeline:true,selectedEvents:nearest.events.map(item=>item.index)});return}if(event.key==="Home")setTime(0,{restoreTimeline:true});else if(event.key==="End")setTime(maxSeekTime(days[state.day]),{restoreTimeline:true});else setTime(state.time+(event.key==="ArrowRight"?1:-1)/60,{restoreTimeline:true})});
render();window.__cameraHistory={MOCK_NOW,days,state,queryState,mediaState,summaryType,activityWindows,visualEvents,setTime,render};
</script></body></html>
