<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate optimistic interaction test</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #F0EDE7;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #fixtures {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    #result {
      margin-block-start: 24px;
      padding: 16px;
      border-radius: 16px;
      background: #FFFFFF;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main id="fixtures"></main>
  <pre id="result">RUNNING</pre>

  <script type="module">
    import "../www/ha-design/ha-design-climate-card.js?interaction-test=7";

    const result = document.querySelector("#result");
    const fixtures = document.querySelector("#fixtures");
    const failures = [];

    const makeHass = (temperature, callService = () => {}, overrides = {}) => ({
      states: {
        "climate.test": {
          state: "cool",
          attributes: {
            temperature,
            current_temperature: 26,
            current_humidity: 50,
            min_temp: 16,
            max_temp: 30,
            target_temp_step: 0.5,
            hvac_modes: ["off", "cool", "fan_only"],
            fan_modes: ["low", "auto"],
          },
        },
        "event.test_notification": {
          state: "unknown",
          attributes: { event_types: ["water_is_full"], event_type: null },
        },
        "number.test_sleep_timer": {
          state: "2",
          attributes: { min: 0, max: 100, step: 1 },
        },
        "sensor.test_sleep_timer": { state: "90", attributes: {} },
        "sensor.test_schedule_turn_on": { state: "2026-08-31T07:30:00+09:00", attributes: {} },
        "sensor.test_schedule_turn_off": { state: "2026-08-31T23:15:00+09:00", attributes: {} },
        "sensor.test_energy_today": { state: "321", attributes: {} },
        "sensor.test_energy_yesterday": { state: "1234", attributes: {} },
        "sensor.test_energy_this_month": { state: "5678", attributes: {} },
        "sensor.test_energy_last_month": { state: "unknown", attributes: {} },
        ...overrides,
      },
      callService,
    });

    const createCard = (title, hass) => {
      const card = document.createElement("ha-design-climate-card");
      card.setConfig({
        entity: "climate.test",
        title,
        details_presentation: "modal",
        notification_entity: "event.test_notification",
        sleep_timer_number_entity: "number.test_sleep_timer",
        sleep_timer_sensor_entity: "sensor.test_sleep_timer",
        schedule_turn_on_entity: "sensor.test_schedule_turn_on",
        schedule_turn_off_entity: "sensor.test_schedule_turn_off",
        energy_entity: "sensor.test_energy_today",
        energy_yesterday_entity: "sensor.test_energy_yesterday",
        energy_this_month_entity: "sensor.test_energy_this_month",
        energy_last_month_entity: "sensor.test_energy_last_month",
      });
      card.hass = hass;
      fixtures.append(card);
      card.shadowRoot.querySelector(".modal-launcher").click();
      return card;
    };

    const displayedTemperature = (card) =>
      Number.parseFloat(card.shadowRoot.querySelector(".stepper output").textContent);
    const closeAndReopen = async (card) => {
      const dialog = card.shadowRoot.querySelector(".details-dialog");
      const closed = new Promise((resolve) => {
        dialog.addEventListener("close", resolve, { once: true });
      });
      card.shadowRoot.querySelector(".dialog-close").click();
      await closed;
      card.shadowRoot.querySelector(".modal-launcher").click();
    };

    const run = async (name, test) => {
      try {
        await test();
      } catch (error) {
        failures.push(`${name}: ${error.message}`);
      }
    };

    await run("rapid temperature", async () => {
      const calls = [];
      let resolveService;
      const serviceCalled = new Promise((resolve) => {
        resolveService = resolve;
      });
      const card = createCard("빠른 입력", makeHass(25, (domain, service, data) => {
        calls.push({ domain, service, data });
        resolveService(calls.at(-1));
      }));
      const increase = card.shadowRoot.querySelector('[data-action="temperature"][data-delta="0.5"]');

      increase.click();
      increase.click();
      increase.click();

      if (displayedTemperature(card) !== 26.5) {
        throw new Error(`immediate output is ${displayedTemperature(card)} instead of 26.5`);
      }

      const timeout = new Promise((_, reject) => {
        window.setTimeout(() => reject(new Error("temperature service was not committed")), 1500);
      });
      const finalCall = await Promise.race([serviceCalled, timeout]);
      if (calls.length !== 1) {
        throw new Error(`expected one service call, received ${calls.length}`);
      }
      if (
        finalCall.domain !== "climate" ||
        finalCall.service !== "set_temperature" ||
        finalCall.data.temperature !== 26.5
      ) {
        throw new Error(`unexpected final service call ${JSON.stringify(finalCall)}`);
      }
    });

    await run("stale reconciliation", async () => {
      const card = createCard("상태 조정", makeHass(25));
      const increase = card.shadowRoot.querySelector('[data-action="temperature"][data-delta="0.5"]');

      increase.click();
      increase.click();
      if (displayedTemperature(card) !== 26) {
        throw new Error(`local target is ${displayedTemperature(card)} instead of 26`);
      }

      card.hass = makeHass(25);
      if (displayedTemperature(card) !== 26) {
        throw new Error(`stale server state rolled UI back to ${displayedTemperature(card)}`);
      }

      card.hass = makeHass(26);
      if (displayedTemperature(card) !== 26) {
        throw new Error("confirmed server state did not preserve 26");
      }

      card.hass = makeHass(24);
      if (displayedTemperature(card) !== 24) {
        throw new Error(`authoritative external state did not update UI: ${displayedTemperature(card)}`);
      }
    });

    await run("LG ThinQ capability safety and commit", async () => {
      const calls = [];
      const card = createCard("추가 기능", makeHass(25, (...call) => calls.push(call)));
      const notification = card.shadowRoot.querySelector('[data-capability="notification"]');
      if (
        notification.classList.contains("is-alert") ||
        notification.dataset.status !== "clear" ||
        !notification.textContent.includes("새 알림 없음")
      ) {
        throw new Error(`unknown notification exposed ${notification.dataset.status}`);
      }

      if (card.shadowRoot.querySelector('[data-input="sleep-timer"]')) {
        throw new Error("sleep timer still exposes a keyboard input");
      }
      const increaseSleepTimer = card.shadowRoot.querySelector(
        '[data-action="sleep-timer-adjust"][data-delta="1"]',
      );
      increaseSleepTimer.click();
      if (
        calls.length !== 1 ||
        calls[0][0] !== "number" ||
        calls[0][1] !== "set_value" ||
        calls[0][2].value !== 3
      ) {
        throw new Error(`first timer adjustment was not saved immediately: ${JSON.stringify(calls)}`);
      }
      increaseSleepTimer.click();
      const sleepSelection = card.shadowRoot.querySelector('[data-output="sleep-timer"]');
      if (
        calls.length !== 2 ||
        calls[1][2].value !== 4 ||
        sleepSelection.dataset.hours !== "4" ||
        sleepSelection.textContent.replace(/\s+/g, "") !== "4시간"
      ) {
        throw new Error(`second timer adjustment was not saved immediately: ${JSON.stringify(calls)}`);
      }
      if (card.shadowRoot.querySelector(".sleep-panel > p")) {
        throw new Error("sleep timer still exposes redundant helper copy");
      }
      if (card.shadowRoot.querySelector('[data-action="sleep-timer"]')) {
        throw new Error("sleep timer still exposes a separate apply button");
      }
      await closeAndReopen(card);
      if (
        card.shadowRoot.querySelector('[data-output="sleep-timer"]').dataset.hours !== "2"
      ) {
        throw new Error("closing the dialog preserved an unsynchronized timer value");
      }

      const readback = card.shadowRoot.querySelector('[data-capability="sleep-readback"]');
      if (readback.dataset.status !== "available" || readback.dataset.minutes !== "90") {
        throw new Error(`unexpected sleep timer readback ${JSON.stringify(readback.dataset)}`);
      }
      for (const capability of ["schedule-turn-on", "schedule-turn-off"]) {
        const schedule = card.shadowRoot.querySelector(`[data-capability="${capability}"]`);
        if (schedule.dataset.status !== "available" || !schedule.dataset.timestamp) {
          throw new Error(`${capability} did not expose its timestamp`);
        }
      }
      const energyValues = ["energy-yesterday", "energy-this-month", "energy-last-month"]
        .map((capability) => card.shadowRoot.querySelector(`[data-capability="${capability}"]`).dataset);
      if (
        energyValues[0].wh !== "1234" ||
        energyValues[1].wh !== "5678" ||
        energyValues[2].status !== "unavailable"
      ) {
        throw new Error(`unexpected energy history ${JSON.stringify(energyValues)}`);
      }

      card.hass = makeHass(25, () => {}, {
        "event.test_notification": {
          state: "2026-08-30T10:00:00+09:00",
          attributes: { event_type: "water_is_full" },
        },
      });
      const activeNotification = card.shadowRoot.querySelector('[data-capability="notification"]');
      if (!activeNotification.classList.contains("is-alert") || activeNotification.dataset.status !== "alert") {
        throw new Error(`explicit water_is_full event exposed ${activeNotification.dataset.status}`);
      }

      card.hass = makeHass(25, () => {}, {
        "climate.test": {
          state: "off",
          attributes: { temperature: 25, current_temperature: 26 },
        },
        "event.test_notification": {
          state: null,
          attributes: { event_type: "water_is_full" },
        },
      });
      const offNotification = card.shadowRoot.querySelector('[data-capability="notification"]');
      if (
        offNotification.classList.contains("is-alert") ||
        offNotification.dataset.status !== "unavailable" ||
        [...card.shadowRoot.querySelectorAll('[data-action="sleep-timer-adjust"]')]
          .some((button) => !button.disabled)
      ) {
        throw new Error("off/null capability state is not neutral");
      }
    });

    await run("idle LG telemetry semantics", async () => {
      const idleTimerCalls = [];
      const card = createCard("미수신 상태", makeHass(25, (...call) => idleTimerCalls.push(call), {
        "number.test_sleep_timer": {
          state: "unknown",
          attributes: { min: 0, max: 100, step: 1 },
        },
        "sensor.test_sleep_timer": { state: "unknown", attributes: {} },
        "sensor.test_schedule_turn_on": { state: "unknown", attributes: {} },
        "sensor.test_schedule_turn_off": { state: "unknown", attributes: {} },
        "sensor.test_energy_today": { state: "0.0", attributes: {} },
        "sensor.test_energy_yesterday": { state: "0.0", attributes: {} },
        "sensor.test_energy_this_month": { state: "0.0", attributes: {} },
        "sensor.test_energy_last_month": { state: "0.0", attributes: {} },
      }));

      const sleepSelection = card.shadowRoot.querySelector('[data-output="sleep-timer"]');
      const sleepDecrease = card.shadowRoot.querySelector(
        '[data-action="sleep-timer-adjust"][data-delta="-1"]',
      );
      const sleepIncrease = card.shadowRoot.querySelector(
        '[data-action="sleep-timer-adjust"][data-delta="1"]',
      );
      const sleepReadback = card.shadowRoot.querySelector('[data-capability="sleep-readback"]');
      if (
        card.shadowRoot.querySelector('[data-input="sleep-timer"]') ||
        !sleepDecrease.disabled ||
        sleepIncrease.disabled ||
        card.shadowRoot.querySelector('[data-action="sleep-timer"]')
      ) {
        throw new Error("unknown timer state did not expose a bounded button stepper");
      }
      if (
        sleepSelection.dataset.hours !== "0" ||
        sleepSelection.textContent.replace(/\s+/g, "") !== "0시간"
      ) {
        throw new Error(`idle timer selection is not hour-only: ${sleepSelection.textContent}`);
      }
      if (
        sleepReadback ||
        card.shadowRoot.querySelector('[data-capability="schedule-turn-on"]') ||
        card.shadowRoot.querySelector('[data-capability="schedule-turn-off"]')
      ) {
        throw new Error("unreported timer or schedule state still rendered placeholder UI");
      }
      sleepIncrease.click();
      if (
        idleTimerCalls.length !== 1 ||
        idleTimerCalls[0][0] !== "number" ||
        idleTimerCalls[0][1] !== "set_value" ||
        idleTimerCalls[0][2].value !== 1 ||
        card.shadowRoot.querySelector('[data-output="sleep-timer"]').dataset.hours !== "1"
      ) {
        throw new Error(`sleep timer plus did not save immediately: ${JSON.stringify(idleTimerCalls)}`);
      }
      await closeAndReopen(card);
      if (card.shadowRoot.querySelector('[data-output="sleep-timer"]').dataset.hours !== "0") {
        throw new Error("closing the dialog preserved an unknown timer draft");
      }

    });

    await run("unreported energy telemetry stays hidden", () => {
      const card = createCard("미수신 에너지", makeHass(25, () => {}, {
        "sensor.test_energy_today": { state: "0.0", attributes: {} },
        "sensor.test_energy_yesterday": { state: "0.0", attributes: {} },
        "sensor.test_energy_this_month": { state: "unavailable", attributes: {} },
        "sensor.test_energy_last_month": { state: "unavailable", attributes: {} },
      }));

      if (
        card.shadowRoot.querySelector(".energy-history") ||
        card.shadowRoot.querySelector(".metrics").children.length !== 2 ||
        getComputedStyle(card.shadowRoot.querySelector(".metrics"))
          .gridTemplateColumns.split(" ").length !== 2
      ) {
        throw new Error("unreported energy telemetry still renders UI");
      }
    });

    const visualScroller = [...document.querySelectorAll("ha-design-climate-card")]
      .at(-1)?.shadowRoot.querySelector(".dialog-scroll");
    if (visualScroller) visualScroller.scrollTop = visualScroller.scrollHeight;

    if (failures.length) {
      document.body.dataset.result = "fail";
      result.textContent = `FAIL\n${failures.join("\n")}`;
    } else {
      document.body.dataset.result = "pass";
      result.textContent = "PASS\nrapid temperature\nstale reconciliation\nLG ThinQ capability safety and commit\nidle LG telemetry semantics\nunreported energy telemetry stays hidden";
    }
  </script>
</body>
</html>
