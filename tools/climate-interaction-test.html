<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate optimistic interaction test</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #F0EDE7;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #fixtures {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    #result {
      margin-block-start: 24px;
      padding: 16px;
      border-radius: 16px;
      background: #FFFFFF;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main id="fixtures"></main>
  <pre id="result">RUNNING</pre>

  <script type="module">
    import "../www/ha-design/ha-design-climate-card.js?interaction-test=2";

    const result = document.querySelector("#result");
    const fixtures = document.querySelector("#fixtures");
    const failures = [];

    const makeHass = (temperature, callService = () => {}, overrides = {}) => ({
      states: {
        "climate.test": {
          state: "cool",
          attributes: {
            temperature,
            current_temperature: 26,
            current_humidity: 50,
            min_temp: 16,
            max_temp: 30,
            target_temp_step: 0.5,
            hvac_modes: ["off", "cool", "fan_only"],
            fan_modes: ["low", "auto"],
          },
        },
        "event.test_notification": {
          state: "unknown",
          attributes: { event_type: "water_is_full" },
        },
        "number.test_sleep_timer": {
          state: "2",
          attributes: { min: 0, max: 100, step: 1 },
        },
        "sensor.test_sleep_timer": { state: "90", attributes: {} },
        "sensor.test_schedule_turn_on": { state: "2026-08-31T07:30:00+09:00", attributes: {} },
        "sensor.test_schedule_turn_off": { state: "2026-08-31T23:15:00+09:00", attributes: {} },
        "sensor.test_energy_yesterday": { state: "1234", attributes: {} },
        "sensor.test_energy_this_month": { state: "5678", attributes: {} },
        "sensor.test_energy_last_month": { state: "unknown", attributes: {} },
        ...overrides,
      },
      callService,
    });

    const createCard = (title, hass) => {
      const card = document.createElement("ha-design-climate-card");
      card.setConfig({
        entity: "climate.test",
        title,
        details_presentation: "modal",
        notification_entity: "event.test_notification",
        sleep_timer_number_entity: "number.test_sleep_timer",
        sleep_timer_sensor_entity: "sensor.test_sleep_timer",
        schedule_turn_on_entity: "sensor.test_schedule_turn_on",
        schedule_turn_off_entity: "sensor.test_schedule_turn_off",
        energy_yesterday_entity: "sensor.test_energy_yesterday",
        energy_this_month_entity: "sensor.test_energy_this_month",
        energy_last_month_entity: "sensor.test_energy_last_month",
      });
      card.hass = hass;
      fixtures.append(card);
      card.shadowRoot.querySelector(".modal-launcher").click();
      return card;
    };

    const displayedTemperature = (card) =>
      Number.parseFloat(card.shadowRoot.querySelector(".stepper output").textContent);

    const run = async (name, test) => {
      try {
        await test();
      } catch (error) {
        failures.push(`${name}: ${error.message}`);
      }
    };

    await run("rapid temperature", async () => {
      const calls = [];
      let resolveService;
      const serviceCalled = new Promise((resolve) => {
        resolveService = resolve;
      });
      const card = createCard("빠른 입력", makeHass(25, (domain, service, data) => {
        calls.push({ domain, service, data });
        resolveService(calls.at(-1));
      }));
      const increase = card.shadowRoot.querySelector('[data-action="temperature"][data-delta="0.5"]');

      increase.click();
      increase.click();
      increase.click();

      if (displayedTemperature(card) !== 26.5) {
        throw new Error(`immediate output is ${displayedTemperature(card)} instead of 26.5`);
      }

      const timeout = new Promise((_, reject) => {
        window.setTimeout(() => reject(new Error("temperature service was not committed")), 1500);
      });
      const finalCall = await Promise.race([serviceCalled, timeout]);
      if (calls.length !== 1) {
        throw new Error(`expected one service call, received ${calls.length}`);
      }
      if (
        finalCall.domain !== "climate" ||
        finalCall.service !== "set_temperature" ||
        finalCall.data.temperature !== 26.5
      ) {
        throw new Error(`unexpected final service call ${JSON.stringify(finalCall)}`);
      }
    });

    await run("stale reconciliation", async () => {
      const card = createCard("상태 조정", makeHass(25));
      const increase = card.shadowRoot.querySelector('[data-action="temperature"][data-delta="0.5"]');

      increase.click();
      increase.click();
      if (displayedTemperature(card) !== 26) {
        throw new Error(`local target is ${displayedTemperature(card)} instead of 26`);
      }

      card.hass = makeHass(25);
      if (displayedTemperature(card) !== 26) {
        throw new Error(`stale server state rolled UI back to ${displayedTemperature(card)}`);
      }

      card.hass = makeHass(26);
      if (displayedTemperature(card) !== 26) {
        throw new Error("confirmed server state did not preserve 26");
      }

      card.hass = makeHass(24);
      if (displayedTemperature(card) !== 24) {
        throw new Error(`authoritative external state did not update UI: ${displayedTemperature(card)}`);
      }
    });

    await run("LG ThinQ capability safety and commit", async () => {
      const calls = [];
      const card = createCard("추가 기능", makeHass(25, (...call) => calls.push(call)));
      const notification = card.shadowRoot.querySelector('[data-capability="notification"]');
      if (notification.classList.contains("is-alert") || notification.dataset.status !== "unavailable") {
        throw new Error(`unknown notification exposed ${notification.dataset.status}`);
      }

      const sleepInput = card.shadowRoot.querySelector('[data-input="sleep-timer"]');
      sleepInput.value = "4";
      sleepInput.dispatchEvent(new InputEvent("input", { bubbles: true }));
      if (calls.length !== 0) {
        throw new Error("sleep timer wrote during input instead of explicit commit");
      }
      card.shadowRoot.querySelector('[data-action="sleep-timer"]').click();
      const [domain, service, data] = calls.at(-1) ?? [];
      if (
        calls.length !== 1 ||
        domain !== "number" ||
        service !== "set_value" ||
        data.entity_id !== "number.test_sleep_timer" ||
        data.value !== 4
      ) {
        throw new Error(`unexpected sleep timer commit ${JSON.stringify(calls)}`);
      }

      const readback = card.shadowRoot.querySelector('[data-capability="sleep-readback"]');
      if (readback.dataset.status !== "available" || readback.dataset.minutes !== "90") {
        throw new Error(`unexpected sleep timer readback ${JSON.stringify(readback.dataset)}`);
      }
      for (const capability of ["schedule-turn-on", "schedule-turn-off"]) {
        const schedule = card.shadowRoot.querySelector(`[data-capability="${capability}"]`);
        if (schedule.dataset.status !== "available" || !schedule.dataset.timestamp) {
          throw new Error(`${capability} did not expose its timestamp`);
        }
      }
      const energyValues = ["energy-yesterday", "energy-this-month", "energy-last-month"]
        .map((capability) => card.shadowRoot.querySelector(`[data-capability="${capability}"]`).dataset);
      if (
        energyValues[0].wh !== "1234" ||
        energyValues[1].wh !== "5678" ||
        energyValues[2].status !== "unavailable"
      ) {
        throw new Error(`unexpected energy history ${JSON.stringify(energyValues)}`);
      }

      card.hass = makeHass(25, () => {}, {
        "event.test_notification": {
          state: "2026-08-30T10:00:00+09:00",
          attributes: { event_type: "water_is_full" },
        },
      });
      const activeNotification = card.shadowRoot.querySelector('[data-capability="notification"]');
      if (!activeNotification.classList.contains("is-alert") || activeNotification.dataset.status !== "alert") {
        throw new Error(`explicit water_is_full event exposed ${activeNotification.dataset.status}`);
      }

      card.hass = makeHass(25, () => {}, {
        "climate.test": {
          state: "off",
          attributes: { temperature: 25, current_temperature: 26 },
        },
        "event.test_notification": {
          state: null,
          attributes: { event_type: "water_is_full" },
        },
      });
      const offNotification = card.shadowRoot.querySelector('[data-capability="notification"]');
      const offSleepCommit = card.shadowRoot.querySelector('[data-action="sleep-timer"]');
      if (
        offNotification.classList.contains("is-alert") ||
        offNotification.dataset.status !== "unavailable" ||
        !offSleepCommit.disabled
      ) {
        throw new Error("off/null capability state is not neutral");
      }
    });

    const visualScroller = [...document.querySelectorAll("ha-design-climate-card")]
      .at(-1)?.shadowRoot.querySelector(".dialog-scroll");
    if (visualScroller) visualScroller.scrollTop = visualScroller.scrollHeight;

    if (failures.length) {
      document.body.dataset.result = "fail";
      result.textContent = `FAIL\n${failures.join("\n")}`;
    } else {
      document.body.dataset.result = "pass";
      result.textContent = "PASS\nrapid temperature\nstale reconciliation\nLG ThinQ capability safety and commit";
    }
  </script>
</body>
</html>
