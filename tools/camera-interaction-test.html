<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카메라 카드 상호작용 테스트</title>
  <style>
    body { margin: 0; padding: 24px; background: #F0EDE7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { inline-size: min(100%, 492px); margin: auto; }
    pre { margin-block-start: 16px; padding: 16px; border-radius: 16px; background: white; }
  </style>
</head>
<body data-result="pending">
  <main>
    <ha-design-camera-card></ha-design-camera-card>
    <pre id="result">RUNNING</pre>
  </main>
  <script type="module">
    const failures = [];
    const check = (condition, message) => { if (!condition) failures.push(message); };
    const state = (value, attributes = {}) => ({ state: value, attributes });
    const calls = [];
    const forceNativeRecordingHls =
      new URLSearchParams(location.search).has("native-hls");
    if (forceNativeRecordingHls) {
      const canPlayType = HTMLMediaElement.prototype.canPlayType;
      HTMLMediaElement.prototype.canPlayType = function(type) {
        return type === "application/vnd.apple.mpegurl"
          ? "maybe"
          : canPlayType.call(this, type);
      };
      Object.defineProperty(navigator, "userAgent", {
        configurable: true,
        value: "Home Assistant iPhone",
      });
      Object.defineProperty(navigator, "platform", {
        configurable: true,
        value: "iPhone",
      });
      Object.defineProperty(navigator, "maxTouchPoints", {
        configurable: true,
        value: 5,
      });
    }
    const apiPaths = [];
    const signals = [];
    const transceivers = [];
    const peerConfigs = [];
    let resolveOffer;
    const offerSent = new Promise((resolve) => { resolveOffer = resolve; });
    class FakePeerConnection extends EventTarget {
      constructor(config) { super(); peerConfigs.push(config); }
      addTransceiver(kind, options) { transceivers.push({ kind, options }); }
      async createOffer() { return { sdp: "mock-offer" }; }
      async setLocalDescription() {}
      async setRemoteDescription() {}
      async addIceCandidate() {}
      close() {}
    }
    class FakeWebSocket extends EventTarget {
      static OPEN = 1;
      constructor(url) {
        super();
        this.url = url;
        this.readyState = FakeWebSocket.OPEN;
        queueMicrotask(() => this.dispatchEvent(new Event("open")));
      }
      send(value) {
        const message = JSON.parse(value);
        signals.push(message);
        if (message.type === "webrtc/offer") resolveOffer(message);
      }
      close() { this.readyState = 3; }
    }
    class FakeMediaStream {
      constructor() { this.tracks = []; }
      addTrack(track) { this.tracks.push(track); }
      removeTrack(track) { this.tracks = this.tracks.filter((current) => current !== track); }
      getTracks() { return [...this.tracks]; }
      getVideoTracks() { return this.tracks.filter(({ kind }) => kind === "video"); }
    }
    window.RTCPeerConnection = FakePeerConnection;
    window.WebSocket = FakeWebSocket;
    window.MediaStream = FakeMediaStream;
    const entity = {
      camera: "camera.test_hd",
      privacy: "switch.test_privacy",
      recording: "switch.test_recording",
      angle: "number.test_angle",
      up: "button.test_up",
      down: "button.test_down",
      left: "button.test_left",
      right: "button.test_right",
      autoTrack: "switch.test_auto_track",
      motion: "select.test_motion",
      person: "select.test_person",
      pet: "select.test_pet",
      vehicle: "select.test_vehicle",
      tamper: "select.test_tamper",
      cry: "select.test_cry",
      bark: "select.test_bark",
      meow: "select.test_meow",
      glass: "select.test_glass",
      motionEvent: "binary_sensor.test_motion",
      personEvent: "binary_sensor.test_person",
      soundEvent: "binary_sensor.test_sound",
      replacementSoundEvent: "binary_sensor.test_sound_replacement",
    };
    const hass = {
      states: {
        [entity.camera]: state("idle", {
          entity_picture: "/api/camera_proxy/test",
          client_id: "frigate",
          camera_name: "main_camera",
        }),
        [entity.privacy]: state("off"),
        [entity.recording]: state("off"),
        [entity.angle]: state("15", { min: 5, max: 120, step: 5 }),
        [entity.up]: state("unavailable"),
        [entity.down]: state("unavailable"),
        [entity.left]: state("unavailable"),
        [entity.right]: state("unavailable"),
        [entity.autoTrack]: state("off"),
        [entity.motion]: state("normal", { options: ["high", "normal", "low", "off"] }),
        [entity.person]: state("normal", { options: ["high", "normal", "low", "off"] }),
        [entity.pet]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.vehicle]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.tamper]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.cry]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.bark]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.meow]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.glass]: state("off", { options: ["high", "normal", "low", "off"] }),
        [entity.motionEvent]: state("off"),
        [entity.personEvent]: state("off"),
        [entity.soundEvent]: state("off"),
        [entity.replacementSoundEvent]: state("off"),
      },
      callApi: async (_method, path) => {
        apiPaths.push(path);
        return [
        [
          { entity_id: entity.motionEvent, state: "off", last_changed: "2026-08-30T09:00:00Z" },
          { state: "on", last_changed: "2026-08-30T10:00:00Z" },
          { state: "off", last_changed: "2026-08-30T10:00:10Z" },
          { state: "on", last_changed: "2026-08-30T11:00:00Z" },
        ],
        [
          { entity_id: entity.personEvent, state: "off", last_changed: "2026-08-30T09:00:00Z" },
          { state: "on", last_changed: "2026-08-30T10:30:00Z" },
        ],
        [
          { entity_id: entity.soundEvent, state: "off", last_changed: "2026-08-30T09:00:00Z" },
          { state: "on", last_changed: "2026-08-30T10:04:30Z" },
        ],
        ];
      },
      callService(domain, service, data) {
        calls.push({ domain, service, data });
      },
      async callWS(message) {
        calls.push({ websocket: message });
        if (message.path?.includes("/vod/")) {
          if (message.path.endsWith("/master.m3u8")) {
            return {
              path: 'data:application/vnd.apple.mpegurl,%23EXTM3U%0A%23EXT-X-STREAM-INF%3ABANDWIDTH%3D750733%2CRESOLUTION%3D1920x1080%2CCODECS%3D%22avc1.640032%2Cmp4a.40.2%22%0Aindex-v1-a1.m3u8%0A',
            };
          }
          return {
            path: "data:application/vnd.apple.mpegurl,%23EXTM3U%0A%23EXT-X-ENDLIST",
          };
        }
        return { path: "/mock-webrtc" };
      },
      hassUrl(path) {
        return path;
      },
    };
    const config = {
      title: "거실 카메라",
      eyebrow: "TAPO · C225 · LOCAL",
      camera_entity: entity.camera,
      privacy_entity: entity.privacy,
      recording_entity: entity.recording,
      movement_angle_entity: entity.angle,
      move_up_entity: entity.up,
      move_down_entity: entity.down,
      move_left_entity: entity.left,
      move_right_entity: entity.right,
      auto_track_entity: entity.autoTrack,
      motion_detection_entity: entity.motion,
      person_detection_entity: entity.person,
      pet_detection_entity: entity.pet,
      vehicle_detection_entity: entity.vehicle,
      tamper_detection_entity: entity.tamper,
      cry_detection_entity: entity.cry,
      bark_detection_entity: entity.bark,
      meow_detection_entity: entity.meow,
      glass_detection_entity: entity.glass,
      motion_event_entity: entity.motionEvent,
      person_event_entity: entity.personEvent,
      sound_event_entity: entity.soundEvent,
    };

    try {
      await import("../www/ha-design/ha-design-camera-card.js?interaction-test=36");
    } catch {
      failures.push("카메라 카드 모듈이 등록되지 않음");
    }

    const card = document.querySelector("ha-design-camera-card");
    if (customElements.get("ha-design-camera-card")) {
      card.setConfig(config);
      card.hass = hass;
      await new Promise(requestAnimationFrame);
      check(!card.shadowRoot.querySelector("ha-design-camera-webrtc-player"), "compact 상태에서 WebRTC player가 미리 생성됨");
      check(![...card.shadowRoot.querySelectorAll(".device-compact-badge")].some((badge) => badge.textContent.trim() === "LIVE"), "compact 카드에 LIVE 배지가 표시됨");

      const preloaded = new Promise((resolve) => card.addEventListener("camera-events-loaded", resolve, { once: true }));
      card.shadowRoot.querySelector(".camera-launcher").click();
      const preloadedInTime = await Promise.race([
        preloaded.then(() => true),
        new Promise((resolve) => setTimeout(() => resolve(false), 2000)),
      ]);
      check(preloadedInTime, "최근 이벤트 자동 로드 시간 초과");
      await new Promise(requestAnimationFrame);
      check(card.shadowRoot.querySelector("dialog").open, "카메라 모달이 열리지 않음");
      check(document.body.style.overflow === "hidden", "모달 배경 스크롤이 잠기지 않음");
      check(card.shadowRoot.activeElement === card.shadowRoot.querySelector(".dialog-close"), "첫 초점이 닫기 버튼이 아님");
      check(card.shadowRoot.querySelector('[data-action="privacy"]').getAttribute("aria-checked") === "false", "프라이버시 상태 불일치");
      check(card.shadowRoot.querySelector('[data-action="recording"]').getAttribute("aria-checked") === "false", "녹화 상태 불일치");
      check(card.shadowRoot.querySelector(".recording-status").classList.contains("off"), "녹화 꺼짐 색상 상태 누락");
      const recordingSectionText = card.shadowRoot.querySelector('[data-action="recording"]')?.closest(".control-section")?.textContent ?? "";
      check(recordingSectionText.includes("Frigate 녹화"), "녹화 스위치가 Frigate 저장 제어임을 표시하지 않음");
      check(recordingSectionText.includes("움직임이 있는 구간을 10일 저장"), "실제 움직임 녹화 보존 정책을 표시하지 않음");
      check(recordingSectionText.includes("카메라 SD카드와 별도"), "Frigate와 카메라 자체 녹화를 구분하지 않음");
      check(!card.shadowRoot.querySelector(".live-badge"), "LIVE 배지가 영상 위에 표시됨");
      check(!card.shadowRoot.querySelector(".recording-badge"), "녹화 OFF에서 REC 배지가 표시됨");
      check([...card.shadowRoot.querySelectorAll("[data-direction]")].every((button) => button.disabled), "unavailable PTZ가 활성화됨");
      check(card.shadowRoot.querySelector('[data-entity="select.test_motion"][data-option="normal"]').getAttribute("aria-pressed") === "true", "움직임 민감도 불일치");
      check(card.shadowRoot.querySelectorAll(".recent-event").length === 3, "최근 이벤트가 카메라 상세에서 자동 로드되지 않음");
      const player = card.shadowRoot.querySelector("ha-design-camera-webrtc-player.live-video");
      check(Boolean(player), "WebRTC 비디오 플레이어가 렌더링되지 않음");
      check(player?.entityid === entity.camera, "WebRTC 플레이어 카메라 엔티티가 다름");
      check(player?.autoPlay === true && player?.playsInline === true, "WebRTC 자동 인라인 재생 설정이 누락됨");
      check(player?.controls === true && player?.muted === true, "비디오 플레이어 기본 제어 설정이 누락됨");
      check(player?.fitMode === "cover", "일반 플레이어 영상 맞춤 방식이 다름");
      await Promise.race([
        offerSent,
        new Promise((_, reject) => setTimeout(() => reject(new Error("WebRTC offer timeout")), 1000)),
      ]);
      check(calls.some((call) => call.websocket?.type === "auth/sign_path"), "HA 인증 WebRTC 경로를 요청하지 않음");
      check(signals.some((message) => message.type === "webrtc/offer"), "비동기 WebRTC offer를 전송하지 않음");
      check(
        transceivers.length === 2
          && transceivers.some(({ kind }) => kind === "video")
          && transceivers.some(({ kind }) => kind === "audio"),
        "영상·소리 WebRTC 연결이 아님",
      );
      for (const kind of ["video", "audio"]) {
        const event = new Event("track");
        Object.defineProperty(event, "track", { value: { kind, stop() {} } });
        player._peer.dispatchEvent(event);
      }
      check(
        player._stream.getTracks().some(({ kind }) => kind === "video")
          && player._stream.getTracks().some(({ kind }) => kind === "audio"),
        "WebRTC MediaStream에 영상과 소리가 함께 유지되지 않음",
      );
      check(peerConfigs[0]?.iceServers?.length === 0, "외부 STUN 서버가 활성화됨");

      card.shadowRoot.querySelector('[data-action="fullscreen"]').click();
      check(card.shadowRoot.querySelector("dialog").classList.contains("video-fullscreen"), "전체화면 플레이어 모드가 열리지 않음");
      check(Boolean(card.shadowRoot.querySelector('[data-action="fullscreen-exit"]')), "전체화면 닫기 버튼이 없음");
      check(card.shadowRoot.querySelector("ha-design-camera-webrtc-player")?.fitMode === "contain", "전체화면에서 전체 프레임이 보이지 않음");
      card.shadowRoot.querySelector("dialog").dispatchEvent(new Event("cancel", { cancelable: true }));
      check(card.shadowRoot.querySelector("dialog").open, "전체화면 Escape가 카메라 모달까지 닫음");
      check(!card.shadowRoot.querySelector("dialog").classList.contains("video-fullscreen"), "전체화면 Escape가 플레이어 모드를 닫지 않음");
      card.shadowRoot.querySelector('[data-action="fullscreen"]').click();
      card.shadowRoot.querySelector('[data-action="fullscreen-exit"]').click();
      check(!card.shadowRoot.querySelector("dialog").classList.contains("video-fullscreen"), "전체화면 플레이어 모드가 닫히지 않음");

      hass.states[entity.recording] = state("on");
      card.hass = hass;
      await new Promise(requestAnimationFrame);
      const recordingBadge = card.shadowRoot.querySelector(".recording-badge");
      check(card.shadowRoot.querySelectorAll(".recording-badge").length === 1, "녹화 ON에서 REC 배지가 하나가 아님");
      check(recordingBadge?.getAttribute("aria-label") === "녹화 중", "REC 배지 의미가 녹화 상태로 전달되지 않음");
      const recordingBadgeStyle = recordingBadge ? getComputedStyle(recordingBadge) : null;
      check(recordingBadgeStyle?.left === "12px", "REC 배지가 좌측 12px에 정렬되지 않음");
      check(recordingBadgeStyle?.bottom === "52px", "REC 배지가 비디오 컨트롤 위에 배치되지 않음");

      card.shadowRoot.querySelector('[data-entity="select.test_motion"][data-option="high"]').click();
      card.shadowRoot.querySelector('[data-action="privacy"]').click();
      check(calls.some((call) => call.domain === "select" && call.service === "select_option" && call.data.option === "high"), "감지 민감도 서비스 누락");
      check(calls.some((call) => call.domain === "switch" && call.service === "turn_on" && call.data.entity_id === entity.privacy), "프라이버시 서비스 누락");

      hass.states[entity.up] = state("unknown");
      card.hass = hass;
      card.shadowRoot.querySelector('[data-direction="up"]').click();
      card.shadowRoot.querySelector('[data-action="angle-increase"]').click();
      check(calls.some((call) => call.domain === "button" && call.service === "press" && call.data.entity_id === entity.up), "PTZ 서비스 누락");
      check(calls.some((call) => call.domain === "number" && call.service === "set_value" && call.data.value === 20), "이동 각도 서비스 누락");

      card.shadowRoot.querySelector('[data-action="events"]').click();
      check(card.shadowRoot.querySelector('[data-view="events"]'), "이벤트 전용 화면이 열리지 않음");
      check(card.shadowRoot.querySelectorAll(".event-header").length === 1, "이벤트 목록 헤더가 하나가 아님");
      const compactBreadcrumb = matchMedia("(max-width: 520px)").matches;
      check(
        card.shadowRoot.querySelector(".event-breadcrumb")?.innerText.replaceAll(/\s+/g, "")
          === (compactBreadcrumb ? "카메라›이벤트히스토리" : "거실카메라›이벤트히스토리"),
        "이벤트 목록 breadcrumb가 다름",
      );
      check(getComputedStyle(card.shadowRoot.querySelector(".event-header")).position === "sticky", "이벤트 헤더가 sticky가 아님");
      check(card.shadowRoot.querySelectorAll("[data-event-kind-filter]").length === 3, "사람·움직임·소리 다중 필터가 아님");
      check([...card.shadowRoot.querySelectorAll("[data-event-kind-filter]")].every((button) => button.getAttribute("aria-pressed") === "true"), "이벤트 필터 기본 다중 선택 상태가 아님");
      check([...card.shadowRoot.querySelectorAll(".event-timeline-axis span")].map((node) => node.textContent).join(",") === "00,04,08,12,16,20,24", "24시간바가 4시간 눈금이 아님");
      check(card.shadowRoot.querySelectorAll(".event-episode").length === 3, "5분 무감지 활동 구간 수가 다름");
      check(card.shadowRoot.querySelectorAll(".event-day.has-events").length === 1, "활동 날짜 점 표시가 다름");
      const nextMonth = card.shadowRoot.querySelector('[data-event-month="1"]');
      check(!nextMonth.disabled, "31일 기록 창의 이벤트 없는 다음 달로 이동할 수 없음");
      nextMonth.click();
      check(card.shadowRoot.querySelector(".event-calendar > header strong").textContent.includes("9월"), "이벤트 없는 다음 달 달력이 열리지 않음");
      check(card.shadowRoot.querySelectorAll(".event-episode").length === 0, "이벤트 없는 달에 활동 구간이 남음");
      card.shadowRoot.querySelector('[data-event-month="-1"]').click();
      check(card.shadowRoot.querySelectorAll(".event-episode").length === 3, "이전 달 복귀 후 활동 구간이 복원되지 않음");
      const personFilter = card.shadowRoot.querySelector('[data-event-kind-filter="person"]');
      personFilter.click();
      check(card.shadowRoot.querySelector('[data-event-kind-filter="person"]').getAttribute("aria-pressed") === "false", "사람 필터 다중 선택 해제가 반영되지 않음");
      check(card.shadowRoot.activeElement === card.shadowRoot.querySelector('[data-event-kind-filter="person"]'), "필터 재렌더 후 초점이 유지되지 않음");
      check(card.shadowRoot.querySelectorAll(".event-episode").length === 2, "사람 필터 해제 후 활동 구간이 갱신되지 않음");
      card.shadowRoot.querySelector('[data-event-kind-filter="person"]').click();
      const eventScroll = card.shadowRoot.querySelector(".dialog-scroll");
      eventScroll.style.blockSize = "320px";
      eventScroll.style.overflowY = "auto";
      eventScroll.scrollTop = 120;
      const expectedEventScroll = eventScroll.scrollTop;
      check(expectedEventScroll > 0, "이벤트 목록 테스트 표면이 스크롤되지 않음");
      let groupedEpisode = [...card.shadowRoot.querySelectorAll(".event-episode")].at(-1);
      groupedEpisode.click();
      check(card.shadowRoot.querySelector('[data-view="activity-detail"]'), "활동 구간 상세 화면이 열리지 않음");
      check(card.shadowRoot.querySelectorAll(".event-header").length === 1, "활동 상세에서 헤더가 중복됨");
      check(!card.shadowRoot.querySelector(".activity-detail-nav"), "활동 상세 내부 헤더가 남아 있음");
      check(
        card.shadowRoot.querySelector(".event-breadcrumb")?.innerText.replaceAll(/\s+/g, "")
          === (compactBreadcrumb
            ? "카메라›이벤트›2026년8월30일›19:04:30이벤트"
            : "거실카메라›이벤트히스토리›2026년8월30일›19:04:30이벤트"),
        "활동 상세 breadcrumb 연도·날짜·이벤트명이 다름",
      );
      check(card.shadowRoot.querySelector(".event-breadcrumb [aria-current='page']")?.textContent === "19:04:30 이벤트", "활동 상세 현재 이벤트명이 표시되지 않음");
      check(card.shadowRoot.querySelectorAll(".raw-event").length === 2, "활동 구간 원본 이벤트 전체가 표시되지 않음");
      check([...card.shadowRoot.querySelectorAll(".raw-event time")].map((node) => node.textContent).join(",") === "19:04:30,19:00:00", "원본 이벤트 최신순 정렬이 다름");
      check(card.shadowRoot.querySelectorAll(".event-timeline-axis span").length === 7, "상세 24시간바 4시간 눈금이 누락됨");
      check(card.shadowRoot.activeElement === card.shadowRoot.querySelector('[data-action="activity-list"]'), "활동 상세 첫 초점이 뒤로가기가 아님");
      const activityBody = card.shadowRoot.querySelector(".activity-detail-body");
      check(!card.shadowRoot.querySelector(".activity-detail-hero"), "불필요한 활동 요약 카드가 남아 있음");
      check(activityBody.firstElementChild?.classList.contains("activity-recording-panel"), "녹화 영상이 활동 상세 첫 영역이 아님");
      const recordingPanel = card.shadowRoot.querySelector(".activity-recording-panel");
      check(recordingPanel.firstElementChild?.classList.contains("activity-recording-frame"), "녹화 영상보다 제목 행이 먼저 표시됨");
      check(recordingPanel.querySelector(":scope > header")?.previousElementSibling?.classList.contains("activity-recording-frame"), "녹화 영상 아래 기본 툴바 순서가 아님");
      check(Math.round(recordingPanel.querySelector(":scope > header")?.getBoundingClientRect().height) === 48, "녹화 영상 하단 툴바가 48px 밀도가 아님");
      check(recordingPanel.querySelector(":scope > header strong")?.textContent === "녹화 영상", "녹화 툴바 제목이 다름");
      check(recordingPanel.querySelector(":scope > header span")?.textContent === "19:04:15–19:05:25 · 1분 10초", "녹화 툴바 실제 영상 범위가 다름");
      check(!card.shadowRoot.querySelector(".activity-recording-video"), "사용자 재생 전 녹화 플레이어가 생성됨");
      const recordingLoaded = new Promise((resolve) => card.addEventListener("camera-recording-loaded", resolve, { once: true }));
      card.shadowRoot.querySelector('[data-action="recording-play"]').click();
      const recordingLoadedInTime = await Promise.race([
        recordingLoaded.then(() => true),
        new Promise((resolve) => setTimeout(() => resolve(false), 2000)),
      ]);
      check(recordingLoadedInTime, "과거 녹화 영상 준비 시간 초과");
      const recordingPlayer = card.shadowRoot.querySelector(".activity-recording-video");
      check(Boolean(recordingPlayer), "과거 녹화 HLS 플레이어가 렌더링되지 않음");
      let nativePauseCalls = 0;
      let nativeLoadCalls = 0;
      if (forceNativeRecordingHls) {
        check(recordingPlayer?.tagName === "VIDEO", "네이티브 HLS에서 video element를 사용하지 않음");
        check(recordingPlayer?.src?.startsWith("data:application/vnd.apple.mpegurl"), "네이티브 video에 signed child URL이 연결되지 않음");
        check(recordingPlayer?.autoplay === true && recordingPlayer?.muted === true, "네이티브 HLS 자동 음소거 설정이 다름");
        const removedAttributes = [];
        const removeAttribute = recordingPlayer.removeAttribute.bind(recordingPlayer);
        recordingPlayer.removeAttribute = (name) => {
          removedAttributes.push(name);
          removeAttribute(name);
        };
        recordingPlayer.pause = () => { nativePauseCalls += 1; };
        recordingPlayer.load = () => { nativeLoadCalls += 1; };
        const nativeSrc = recordingPlayer.getAttribute("src");
        card.hass = hass;
        await new Promise(requestAnimationFrame);
        check(card.shadowRoot.querySelector(".activity-recording-video") === recordingPlayer, "HA 상태 갱신에서 네이티브 video element가 교체됨");
        check(recordingPlayer.getAttribute("src") === nativeSrc, "HA 상태 갱신에서 네이티브 video src가 바뀜");
        check(!removedAttributes.includes("src"), "HA 상태 갱신에서 네이티브 video src를 제거함");
      } else {
        check(recordingPlayer?.tagName === "HA-HLS-PLAYER", "Chromium에서 HA HLS player를 사용하지 않음");
        check(recordingPlayer?.url?.startsWith("data:application/vnd.apple.mpegurl"), "서명된 과거 녹화 URL이 플레이어에 연결되지 않음");
        const recordingMaster = decodeURIComponent(recordingPlayer?.url?.split(",")[1] ?? "");
        check(recordingMaster.includes('CODECS="avc1.640032,mp4a.40.2"'), "HLS master codec 정보가 누락됨");
        check(recordingMaster.includes("data:application/vnd.apple.mpegurl"), "master가 별도 서명된 child playlist를 가리키지 않음");
        check(!recordingMaster.includes("index-v1-a1.m3u8"), "서명되지 않은 master child URL이 남아 있음");
        check(recordingPlayer?.autoPlay === true && recordingPlayer?.muted === true, "과거 녹화 자동 음소거 재생 설정이 다름");
      }
      check(recordingPlayer?.controls === true && recordingPlayer?.playsInline === true, "과거 녹화 native 제어 설정이 누락됨");
      check(
        calls.some((call) => call.websocket?.path?.includes("/api/frigate/frigate/vod/clip/main_camera/start/")),
        "감지 시각 기반 Frigate VOD 서명 경로를 요청하지 않음",
      );
      card.shadowRoot.querySelector("dialog").dispatchEvent(new Event("cancel", { cancelable: true }));
      check(card.shadowRoot.querySelector(".dialog-scroll").scrollTop === expectedEventScroll, "활동 상세 Escape 후 목록 스크롤이 복원되지 않음");
      check(!card.shadowRoot.querySelector(".activity-recording-video"), "활동 상세 종료 후 과거 녹화 플레이어가 남아 있음");
      if (forceNativeRecordingHls) {
        check(nativePauseCalls === 1 && nativeLoadCalls === 1, "네이티브 video가 pause·src 제거·load로 종료되지 않음");
      }
      check(card.shadowRoot.activeElement === [...card.shadowRoot.querySelectorAll(".event-episode")].at(-1), "활동 상세 Escape 후 원래 구간 초점이 복원되지 않음");
      groupedEpisode = [...card.shadowRoot.querySelectorAll(".event-episode")].at(-1);
      groupedEpisode.click();
      card.shadowRoot.querySelector('[data-action="activity-list"]').click();
      check(card.shadowRoot.activeElement === [...card.shadowRoot.querySelectorAll(".event-episode")].at(-1), "활동 상세 종료 후 원래 구간 초점이 복원되지 않음");
      card.shadowRoot.querySelector('[data-action="camera-view"]').click();
      check(card.shadowRoot.querySelector('[data-view="camera"]'), "카메라 화면으로 돌아오지 않음");

      card.shadowRoot.querySelector('[data-action="dismiss"]').click();
      check(!card.shadowRoot.querySelector("dialog").open, "카메라 모달이 닫히지 않음");
      check(!card.shadowRoot.querySelector("ha-design-camera-webrtc-player"), "모달 종료 후 WebRTC player가 남아 있음");
      check(document.body.style.overflow === "", "모달 종료 후 스크롤이 복원되지 않음");
      check(card.shadowRoot.activeElement === card.shadowRoot.querySelector(".camera-launcher"), "포커스가 카드로 복귀하지 않음");

      card.setConfig({ ...config, sound_event_entity: entity.replacementSoundEvent });
      check(card._eventController.state.status === "idle", "이벤트 원천 설정 변경 후 이전 기록이 무효화되지 않음");
      const sourceReloaded = new Promise((resolve) => card.addEventListener("camera-events-loaded", resolve, { once: true }));
      card.shadowRoot.querySelector(".camera-launcher").click();
      const sourceReloadedInTime = await Promise.race([
        sourceReloaded.then(() => true),
        new Promise((resolve) => setTimeout(() => resolve(false), 2000)),
      ]);
      check(sourceReloadedInTime && card._eventController.state.status === "ready", "이벤트 원천 설정 변경 후 기록을 다시 불러오지 않음");
      check(apiPaths.at(-1).includes(entity.replacementSoundEvent), "변경된 소리 이벤트 원천으로 기록을 요청하지 않음");
      card.shadowRoot.querySelector('[data-action="dismiss"]').click();

      const fixedCard = document.createElement("ha-design-camera-card");
      document.querySelector("main").append(fixedCard);
      const fixedConfig = {
        title: "아기 카메라",
        eyebrow: "TAPO · C120 · LOCAL",
        camera_entity: entity.camera,
        stream_name: "c120_1",
        privacy_entity: entity.privacy,
        recording_entity: entity.recording,
        motion_detection_entity: entity.motion,
        person_detection_entity: entity.person,
        pet_detection_entity: entity.pet,
        vehicle_detection_entity: entity.vehicle,
        cry_detection_entity: entity.cry,
        bark_detection_entity: entity.bark,
        meow_detection_entity: entity.meow,
        glass_detection_entity: entity.glass,
        motion_event_entity: entity.motionEvent,
        person_event_entity: entity.personEvent,
        sound_event_entity: entity.soundEvent,
      };
      let fixedConfigAccepted = true;
      try {
        fixedCard.setConfig(fixedConfig);
        fixedCard.hass = hass;
      } catch {
        fixedConfigAccepted = false;
      }
      check(fixedConfigAccepted, "고정형 카메라의 선택적 기능 설정을 허용하지 않음");
      if (fixedConfigAccepted) {
        const fixedLoaded = new Promise((resolve) => fixedCard.addEventListener("camera-events-loaded", resolve, { once: true }));
        fixedCard.shadowRoot.querySelector(".camera-launcher").click();
        await fixedLoaded;
        check(!fixedCard.shadowRoot.querySelector(".ptz-layout"), "PTZ가 없는 고정형 카메라에 방향 조절이 표시됨");
        check(!fixedCard.shadowRoot.querySelector('[data-entity="select.test_tamper"]'), "가림 감지가 없는 카메라에 빈 감지 제어가 표시됨");
        check(fixedCard.shadowRoot.querySelector(".dialog-header small")?.textContent === fixedConfig.eyebrow, "상세 제목이 카메라별 eyebrow를 사용하지 않음");
        check(![...fixedCard.shadowRoot.querySelectorAll(".device-compact-badge")].some((badge) => badge.textContent.trim() === "LIVE"), "고정형 compact 카드에 LIVE 배지가 표시됨");
        check(calls.some((call) => call.websocket?.path?.includes("src=c120_1")), "카메라별 go2rtc stream override가 적용되지 않음");
        fixedCard.shadowRoot.querySelector('[data-action="dismiss"]').click();
      }
    }

    document.body.dataset.result = failures.length ? "fail" : "pass";
    document.querySelector("#result").textContent = failures.length
      ? `FAIL\n${failures.join("\n")}`
      : "PASS\n카메라 제어\n감지 민감도\n이벤트 히스토리\n모달 포커스";
  </script>
</body>
</html>
