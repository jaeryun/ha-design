<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared adaptive device cards</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 12px;
      background: #F0EDE7;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { display: grid; gap: 28px; inline-size: min(100%, 492px); margin-inline: auto; }
    header { display: grid; gap: 6px; }
    header small, .variant-heading small {
      color: #8A641F;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    header h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -.03em; }
    header p { margin: 0; color: #716D64; font-size: 14px; line-height: 1.5; }
    .variant { display: grid; gap: 12px; }
    .variant-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
    .variant-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
    .variant-heading span { color: #9A958A; font-size: 12px; }
    .wide-stack { display: grid; gap: 12px; }
    .narrow-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    ha-design-climate-card, ha-design-light-card { display: block; inline-size: 100%; }
    output {
      justify-self: start;
      padding: 7px 11px;
      border-radius: 999px;
      background: #FFFFFF;
      color: #716D64;
      font-size: 12px;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(26, 26, 24, .08);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <small>DEVICE CARD SYSTEM</small>
      <h1>한 문법, 가변 밀도</h1>
      <p>같은 카드가 할당된 가로 폭에 맞춰 정보 밀도를 바꿉니다.</p>
    </header>
    <section class="variant">
      <div class="variant-heading">
        <div><small>WIDE</small><h2>기본 카드</h2></div>
        <span>1 column</span>
      </div>
      <div class="wide-stack">
        <ha-design-climate-card id="climate-wide"></ha-design-climate-card>
        <ha-design-light-card id="light-wide"></ha-design-light-card>
      </div>
    </section>
    <section class="variant" id="narrow-showcase">
      <div class="variant-heading">
        <div><small>NARROW</small><h2>좁은 카드</h2></div>
        <span>responsive</span>
      </div>
      <div class="narrow-grid">
        <ha-design-climate-card id="climate-narrow"></ha-design-climate-card>
        <ha-design-light-card id="light-narrow"></ha-design-light-card>
      </div>
    </section>
    <output id="result">RUNNING</output>
  </main>
  <script type="module">
    import "../www/ha-design/ha-design-climate-card.js?visual-contract=5";
    import "../www/ha-design/ha-design-light-card.js?visual-contract=5";

    const climateEntity = "climate.test";
    const lightEntity = "light.test";
    const hass = {
      states: {
        [climateEntity]: {
          entity_id: climateEntity,
          state: "cool",
          attributes: {
            current_temperature: 26,
            temperature: 24,
            hvac_modes: ["cool", "dry", "fan_only", "auto"],
            fan_modes: ["low", "medium", "high"],
            min_temp: 16,
            max_temp: 30,
          },
        },
        [lightEntity]: {
          entity_id: lightEntity,
          state: "on",
          attributes: {
            brightness: 168,
            color_temp_kelvin: 3200,
            supported_color_modes: ["color_temp", "hs"],
            min_color_temp_kelvin: 2000,
            max_color_temp_kelvin: 9000,
          },
        },
      },
      callService() {},
    };

    const climateConfig = {
      entity: climateEntity,
      title: "안방 에어컨",
      eyebrow: "CLIMATE · BEDROOM",
      details_presentation: "modal",
      hero_image: "../www/ha-design/images/climate/living-room.png",
    };
    const lightConfig = {
      entity: lightEntity,
      title: "안방 조명",
      eyebrow: "LIGHTING · BEDROOM",
      hero_image: "https://images.unsplash.com/photo-1632119289059-793dd347950f?auto=format&fit=crop&w=1600&q=85",
    };
    const configure = (selector, config) => {
      const host = document.querySelector(selector);
      host.setConfig(config);
      host.hass = hass;
      return host;
    };
    const climateWide = configure("#climate-wide", climateConfig);
    const lightWide = configure("#light-wide", lightConfig);
    const climateNarrow = configure("#climate-narrow", climateConfig);
    const lightNarrow = configure("#light-narrow", lightConfig);

    const result = document.querySelector("#result");
    try {
      await new Promise(requestAnimationFrame);
      const geometry = (host) => {
        const root = host.shadowRoot;
        return {
          card: root.querySelector(".device-card").getBoundingClientRect().height,
          hero: root.querySelector(".device-compact-visual").getBoundingClientRect().height,
          tail: root.querySelector(".device-compact-tail").getBoundingClientRect().height,
        };
      };
      const climateGeometry = geometry(climateWide);
      const lightGeometry = geometry(lightWide);
      if (JSON.stringify(climateGeometry) !== JSON.stringify(lightGeometry)) {
        throw new Error(`compact geometry differs: ${JSON.stringify({ climateGeometry, lightGeometry })}`);
      }
      if (climateGeometry.card !== 164 || climateGeometry.hero !== 154 || climateGeometry.tail !== 10) {
        throw new Error(`shared compact geometry changed: ${JSON.stringify(climateGeometry)}`);
      }
      const climateNarrowGeometry = geometry(climateNarrow);
      const lightNarrowGeometry = geometry(lightNarrow);
      if (JSON.stringify(climateNarrowGeometry) !== JSON.stringify(lightNarrowGeometry)) {
        throw new Error(`narrow geometry differs: ${JSON.stringify({ climateNarrowGeometry, lightNarrowGeometry })}`);
      }
      if (
        climateNarrowGeometry.card !== 164 ||
        climateNarrowGeometry.hero !== 154 ||
        climateNarrowGeometry.tail !== 10
      ) {
        throw new Error(`shared narrow geometry changed: ${JSON.stringify(climateNarrowGeometry)}`);
      }
      for (const host of [climateNarrow, lightNarrow]) {
        const root = host.shadowRoot;
        if (root.querySelector(".device-compact").dataset.deviceCompactLayout !== "adaptive") {
          throw new Error("adaptive layout marker is missing");
        }
        if (getComputedStyle(root.querySelector(".device-compact-status--wide")).display !== "none") {
          throw new Error("narrow card still shows wide status");
        }
        if (getComputedStyle(root.querySelector(".device-compact-status--narrow")).display === "none") {
          throw new Error("narrow card hides concise status");
        }
      }
      const closeAndAssert = async (host, closeSelector) => {
        const root = host.shadowRoot;
        const dialog = root.querySelector("dialog");
        const closed = new Promise((resolve) => {
          dialog.addEventListener("close", resolve, { once: true });
        });
        root.querySelector(closeSelector).click();
        await closed;
        const currentLauncher = root.querySelector(".device-compact");
        if (root.activeElement !== currentLauncher) {
          throw new Error("narrow close did not restore focus to its current launcher");
        }
        if (currentLauncher.getAttribute("aria-expanded") !== "false") {
          throw new Error("narrow close did not reset aria-expanded");
        }
      };
      climateNarrow.shadowRoot.querySelector(".device-compact").dispatchEvent(
        new KeyboardEvent("keydown", { key: "Enter", bubbles: true }),
      );
      if (!climateNarrow.shadowRoot.querySelector("dialog")?.open) {
        throw new Error("climate narrow Enter key did not open details");
      }
      await closeAndAssert(climateNarrow, ".dialog-close");
      lightNarrow.shadowRoot.querySelector(".device-compact").dispatchEvent(
        new KeyboardEvent("keydown", { key: " ", bubbles: true }),
      );
      if (!lightNarrow.shadowRoot.querySelector("dialog")?.open) {
        throw new Error("light narrow Space key did not open details");
      }
      await closeAndAssert(lightNarrow, '[data-action="close"]');
      document.body.dataset.result = "pass";
      result.textContent = "PASS";
    } catch (error) {
      document.body.dataset.result = "fail";
      result.textContent = `FAIL: ${error.message}`;
    }
  </script>
</body>
</html>
