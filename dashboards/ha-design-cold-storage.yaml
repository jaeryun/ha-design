# 실제 Home Assistant 엔티티 ID에 맞게 아래 예시 값을 교체한다.
views:
  - title: 냉장 기기
    path: cold-storage
    icon: mdi:fridge-outline
    type: sections
    max_columns: 1
    background: "#F0EDE7"
    sections:
      - type: grid
        cards:
          - type: custom:ha-design-cold-storage-card
            kind: refrigerator
            title: 냉장고
            eyebrow: SAMSUNG · RF60DB9KF201
            model_name: RF60DB9KF201
            hero_fit: contain
            hero_image: "https://images.samsung.com/kdp/goods/2024/12/27/d39cafbb-2526-4a00-b951-f25976215348.png?$450_N_PNG$"
            door_entities:
              - binary_sensor.jubang_naengjanggo_fridge_door
              - binary_sensor.jubang_naengjanggo_freezer_door
              - binary_sensor.jubang_naengjanggo_coolselect_door
            quick_cool_entity: switch.jubang_naengjanggo_power_cool
            zones:
              - name: 냉장실
                entity: number.jubang_naengjanggo_fridge_temperature
                description: 신선 식품 보관
              - name: 냉동실
                entity: number.jubang_naengjanggo_freezer_temperature
                description: 냉동 식품 보관

          - type: custom:ha-design-cold-storage-card
            kind: kimchi
            title: 김치냉장고
            eyebrow: BESPOKE KIMCHI PLUS · 2021
            model_name: TP1X_REF_21K
            hero_image: "https://images.samsung.com/kdp/cms_contents/507522/ae3a7020-25c2-430a-97eb-72c9a17348cc.jpg?$ORIGIN_JPG$"
            door_entity: binary_sensor.jubang_gimcinaengjanggo_door
            section_eyebrow: ENERGY STATUS
            section_title: 사용 상태
            summary_label: 전력 · 에너지
            normal_status: 문이 닫혀 있고 정상적으로 작동 중이에요.
            zones:
              - name: 현재 전력
                entity: sensor.jubang_gimcinaengjanggo_power
                description: 지금 사용량
              - name: 누적 에너지
                entity: sensor.jubang_gimcinaengjanggo_energy
                description: 전체 사용량
