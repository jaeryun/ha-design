      entity: sensor.jubang_naengjanggo_fridge_temperature
      target_entity: number.jubang_naengjanggo_fridge_temperature
      description: 실제 센서 온도
    - name: 냉동실
      entity: sensor.jubang_naengjanggo_freezer_temperature
      target_entity: number.jubang_naengjanggo_freezer_temperature
      description: 실제 센서 온도

