# 주방 view
- type: custom:ha-design-cold-storage-card
  grid_options:
    columns: 6
    rows: auto
  kind: refrigerator
  title: 냉장고
  eyebrow: RF60 · COTA WHITE
  model_name: RF60DB9KF201
  hero_variant: studio
  hero_product_image: "https://images.samsung.com/kdp/goods/2024/12/27/d39cafbb-2526-4a00-b951-f25976215348.png?$450_N_PNG$"
  door_entities:
    - binary_sensor.jubang_naengjanggo_fridge_door
    - binary_sensor.jubang_naengjanggo_freezer_door
