# ha-design storage 대시보드 Raw 구성 편집기 붙여넣기용
#
# 먼저 대시보드 리소스에서 아래 세 module을 등록한다.
# - dashboards/ha-design-light-resource.yaml
# - dashboards/ha-design-resource.yaml
# - dashboards/ha-design-curtain-resource.yaml
views:
  - title: 안방
    path: bedroom
    icon: mdi:lightbulb-outline
    background: "#F0EDE7"
    cards:
      - type: custom:ha-design-light-card
        entity: light.anbang_anbang_jomyeong
        title: 안방 조명
        eyebrow: LIGHTING · BEDROOM
        hero_image: https://images.unsplash.com/photo-1632119289059-793dd347950f?auto=format&fit=crop&w=1600&q=85

  - title: 에어컨
    path: climate
    icon: mdi:air-conditioner
    background: "#F0EDE7"
    cards:
      - type: custom:ha-design-climate-card
        entity: climate.geosil_eeokeon
        title: 거실 에어컨
        eyebrow: CLIMATE · LIVING ROOM
        details_presentation: modal
        hero_image: https://raw.githubusercontent.com/jaeryun/ha-design/3473c8bb2fe6cf872af52ef72f7bed2fad0d983d/www/ha-design/images/climate/living-room.png
        humidity_entity: sensor.geosil_eeokeon_humidity
        filter_entity: sensor.geosil_eeokeon_filter_remaining
        energy_entity: sensor.geosil_geosil_eeokeon_energy_today
        energy_saving_entity: switch.geosil_eeokeon_energy_saving

      - type: custom:ha-design-climate-card
        entity: climate.anbang_eeokeon
        title: 안방 에어컨
        eyebrow: CLIMATE · BEDROOM
        details_presentation: modal
        hero_image: https://raw.githubusercontent.com/jaeryun/ha-design/3473c8bb2fe6cf872af52ef72f7bed2fad0d983d/www/ha-design/images/climate/living-room.png
        humidity_entity: sensor.anbang_eeokeon_humidity
        filter_entity: sensor.anbang_eeokeon_filter_remaining
        energy_entity: sensor.anbang_anbang_eeokeon_energy_today
        energy_saving_entity: switch.anbang_eeokeon_energy_saving

  - title: 커튼
    path: curtain
    icon: mdi:curtains
    type: sections
    max_columns: 1
    background: "#F0EDE7"
    sections:
      - type: grid
        cards:
          - type: custom:ha-design-curtain-card
            entity: cover.geosilkeoteun
            title: 거실 커튼
            eyebrow: CURTAIN · LIVING ROOM
            travel_duration: 8.8
            hero_image: https://images.unsplash.com/photo-1763718869063-41678d34069d?auto=format&fit=crop&w=1200&h=1200&q=85
          - type: custom:ha-design-curtain-card
            entity: cover.anbangkeoteun
            title: 안방 커튼
            eyebrow: CURTAIN · BEDROOM
            travel_duration: 7.4
            hero_image: https://images.unsplash.com/photo-1763718869063-41678d34069d?auto=format&fit=crop&w=1200&h=1200&q=85
