# ha-design 예시 대시보드 — storage(UI) 모드 raw editor 붙여넣기용
#
# 사용법:
#   1) 대시보드 편집(연필) → 우상단 ⋮ → Raw 구성 편집기
#   2) 이 파일 내용 전체를 붙여넣기 (button_card_templates_url + views)
#   3) 저장
#
# 전제: HACS에서 button-card만 설치
# 엔티티 치환: light.bedroom → 실제 안방 조명 엔티티
button_card_templates_url:
  - https://raw.githubusercontent.com/jaeryun/ha-design/main/www/ha-design/templates.yaml
views:
  - title: 홈
    path: home
    background: "#F0EDE7"
    cards:
      - type: custom:button-card
        template: hd_light_card
        entity: light.bedroom
        variables:
          image_on: https://raw.githubusercontent.com/jaeryun/ha-design/main/www/ha-design/images/lighting/bedroom_on.svg
          image_off: https://raw.githubusercontent.com/jaeryun/ha-design/main/www/ha-design/images/lighting/bedroom_off.svg
          eyebrow: LIGHTING
          headline_on: 안방 조명이 켜져 있어요
          headline_off: 안방 조명이 꺼져 있어요
          row_label: 천장
