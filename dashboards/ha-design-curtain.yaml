# ha-design 커튼 카드 선언 (실제 엔티티 매핑 정본)
#
# Lovelace resource: dashboards/ha-design-curtain-resource.yaml
#
# 배치: 거실 view, 안방 view

# 거실 view
- type: custom:ha-design-curtain-card
  grid_options:
    columns: 6
    rows: auto
  entity: cover.geosilkeoteun
  title: 거실 커튼
  eyebrow: CURTAIN · LIVING ROOM
  travel_duration: 8.8
  motor_fault_entity: binary_sensor.geosilkeoteun_motor_fault
  reverse_direction_entity: select.geosilkeoteun_reverse_direction
  motor_working_mode_entity: select.geosilkeoteun_motor_working_mode
  upper_stroke_limit_entity: select.geosilkeoteun_upper_stroke_limit
  middle_stroke_limit_entity: select.geosilkeoteun_middle_stroke_limit
  lower_stroke_limit_entity: select.geosilkeoteun_lower_stroke_limit
  hero_image: https://images.unsplash.com/photo-1763718869063-41678d34069d?auto=format&fit=crop&w=1200&h=1200&q=85

# 안방 view
- type: custom:ha-design-curtain-card
  grid_options:
    columns: 6
    rows: auto
  entity: cover.anbangkeoteun
  title: 안방 커튼
  eyebrow: CURTAIN · BEDROOM
  travel_duration: 7.4
  motor_fault_entity: binary_sensor.anbangkeoteun_motor_fault
  reverse_direction_entity: select.anbangkeoteun_reverse_direction
  motor_working_mode_entity: select.anbangkeoteun_motor_working_mode
  upper_stroke_limit_entity: select.anbangkeoteun_upper_stroke_limit
  middle_stroke_limit_entity: select.anbangkeoteun_middle_stroke_limit
  lower_stroke_limit_entity: select.anbangkeoteun_lower_stroke_limit
  hero_image: https://images.unsplash.com/photo-1763718869063-41678d34069d?auto=format&fit=crop&w=1200&h=1200&q=85
