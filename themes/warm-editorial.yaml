# Warm Editorial — ha-design 테마
# 크림/베이지 에디토리얼 팔레트 + Pretendard 폰트
warm-editorial:
  # 기본 인터페이스 색
  modes:
    light: {}
  primary-color: "#1A1A18"
  accent-color: "#0E9AA7"
  paper-item-selected-color: "#1A1A18"

  # 배경/카드 (에디토리얼 크림 무드)
  lovelace-background: "#F0EDE7"
  card-background-color: "#FFFFFF"
  secondary-background-color: "#F4F1EA"
  divider-color: "rgba(26,26,24,0.08)"
  state-icon-active-color: "#E8A33D"

  # 텍스트
  primary-text-color: "#1A1A18"
  secondary-text-color: "#8A8578"
  text-primary-color: "#FFFFFF"

  # 도메인별 액센트 (CSS 변수로 카드에서 참조)
  # --ha-design-gold / -blue / -green / -purple / -rose
  ha-design-gold: "#E8A33D"
  ha-design-blue: "#3D6FE0"
  ha-design-green: "#2FA36B"
  ha-design-purple: "#8B5CF6"
  ha-design-rose: "#C25B6A"

  # 폰트 (Pretendard)
  paper-font-common-base_-_font-family: "'Pretendard', 'Noto Sans KR', sans-serif"
  paper-font-common-code_-_font-family: "'Pretendard Mono', monospace"
